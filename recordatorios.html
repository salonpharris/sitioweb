<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="manifest" href="manifest.json">
<link rel="icon" type="image/png" sizes="32x32" href="assets/icons/favicon-32.png">
<link rel="icon" type="image/png" sizes="16x16" href="assets/icons/favicon-16.png">
<link rel="apple-touch-icon" href="assets/icons/apple-touch-icon.png">
<link rel="apple-touch-icon" sizes="152x152" href="assets/icons/apple-touch-icon-152.png">
<link rel="apple-touch-icon" sizes="167x167" href="assets/icons/apple-touch-icon-167.png">
<meta name="theme-color" content="#0a1030">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Sitio PH">
<title>Recordatorios — Paul Harris</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,500;1,500;1,600&family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<script type="module" src="assets/js/auth-guard.js"></script>
<style>
  html.auth-pending{ visibility:hidden; }

  :root{
    --bg-0:#04050c; --bg-1:#0a1030; --bg-2:#161f5c; --bg-3:#2b3bb0; --bg-4:#3f4fe0;
    --glow:#6d86ff; --glow-soft:#7fa0ff;
    --ink:#f4f5fb; --ink-dim:#aeb6e0; --ink-faint:#7078a8;
    --line: rgba(255,255,255,0.10);
    --card: rgba(255,255,255,0.045);
    --card-hover: rgba(255,255,255,0.09);
    --radius:14px;
    --red:#e0503f;
    --sans:'Outfit', sans-serif;
    --serif:'Playfair Display', serif;
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  html{scroll-behavior:smooth;}
  body{
    font-family:var(--sans);
    background:
      radial-gradient(ellipse 120% 60% at 50% -10%, #0e1650 0%, transparent 55%),
      linear-gradient(115deg, var(--bg-0) 0%, var(--bg-1) 28%, var(--bg-2) 55%, var(--bg-3) 78%, var(--bg-4) 100%);
    background-attachment: fixed;
    color:var(--ink);
    min-height:100vh;
    -webkit-font-smoothing:antialiased;
  }
  a{color:inherit; text-decoration:none;}
  button{font-family:inherit;}
  :focus-visible{ outline:2px solid var(--glow-soft); outline-offset:3px; border-radius:8px; }

  .wrap{ max-width:820px; margin:0 auto; padding:0 24px 90px; }
  @media (min-width:900px){ .wrap{ max-width:920px; padding:0 40px 100px; } }

  .topbar{ display:flex; align-items:center; justify-content:space-between; padding:26px 0 0; }
  .back-link{ display:inline-flex; align-items:center; gap:8px; font-size:12.5px; letter-spacing:0.08em; text-transform:uppercase; color:var(--ink-faint); }
  .back-link:hover{ color:var(--ink-dim); }
  .back-link svg{ width:15px; height:15px; stroke:currentColor; fill:none; stroke-width:1.6; }
  .auth-slot{ display:flex; align-items:center; gap:12px; }
  .auth-logout{
    font-family:var(--sans); font-size:12px; letter-spacing:0.05em; color:var(--ink-dim);
    background:rgba(255,255,255,0.06); border:1px solid var(--line); border-radius:999px;
    padding:7px 14px; cursor:pointer; transition:background .25s ease, border-color .25s ease;
  }
  .auth-logout:hover{ background:var(--card-hover); border-color:rgba(255,255,255,.22); }

  .hero{ padding:22px 0 26px; text-align:center; }
  .eyebrow{ font-family:var(--serif); font-style:normal; font-size:20px; color:var(--ink-dim); display:block; }
  .title-main{
    font-weight:600; font-size:clamp(30px,7vw,42px); margin-top:2px; display:block;
    background:linear-gradient(180deg,#fff 0%, #c9d3ff 100%); -webkit-background-clip:text; background-clip:text; color:transparent;
  }

  .toolbar{ display:flex; justify-content:flex-end; margin-top:20px; }
  .btn{
    font-family:var(--sans); font-size:13px; font-weight:500; letter-spacing:0.02em;
    padding:11px 18px; border-radius:999px; border:1px solid var(--line);
    background:var(--card); color:var(--ink); cursor:pointer;
    transition:background .25s ease, border-color .25s ease;
    white-space:nowrap;
  }
  .btn:hover{ background:var(--card-hover); border-color:rgba(255,255,255,.22); }
  .btn-edit{ background:var(--red); border-color:var(--red); color:#fff; font-weight:600; }
  .btn-edit:hover{ background:#c9432f; }
  .btn-edit.active{ background:transparent; color:var(--ink-dim); border-color:var(--line); }

  .section-label{
    font-size:12px; letter-spacing:0.22em; text-transform:uppercase; color:var(--ink-faint);
    font-weight:500; margin:36px 0 16px; display:flex; align-items:center; gap:12px;
  }
  .section-label::after{ content:""; flex:1; height:1px; background:linear-gradient(90deg,var(--line),transparent); }

  .empty-state{
    padding:34px 20px; text-align:center; color:var(--ink-faint); font-size:13.5px;
    border:1px dashed var(--line); border-radius:var(--radius); grid-column:1 / -1;
  }

  .photo-grid{
    display:grid; grid-template-columns:repeat(2, 1fr); gap:12px;
  }
  @media (min-width:600px){ .photo-grid{ grid-template-columns:repeat(3, 1fr); } }
  @media (min-width:900px){ .photo-grid{ grid-template-columns:repeat(4, 1fr); } }

  .photo-tile{
    position:relative; aspect-ratio:1/1; border-radius:var(--radius); overflow:hidden;
    background:var(--card); border:1px solid var(--line); cursor:pointer;
  }
  .photo-tile img{ width:100%; height:100%; object-fit:cover; display:block; transition:transform .3s ease; }
  .photo-tile:hover img{ transform:scale(1.04); }

  .photo-actions{
    position:absolute; top:6px; right:6px; display:flex; gap:6px;
  }
  .photo-actions button{
    width:30px; height:30px; border-radius:8px; border:1px solid rgba(255,255,255,0.25);
    background:rgba(4,5,12,0.65); color:#fff; cursor:pointer; display:flex; align-items:center; justify-content:center;
    backdrop-filter:blur(4px);
  }
  .photo-actions button svg{ width:15px; height:15px; stroke:currentColor; fill:none; stroke-width:1.8; }
  .photo-actions .del-btn:hover{ background:rgba(224,80,63,0.85); border-color:#e0503f; }
  .photo-actions .move-btn:hover{ background:rgba(127,160,255,0.75); border-color:var(--glow-soft); }

  .upload-tile{
    aspect-ratio:1/1; border-radius:var(--radius); border:1.5px dashed var(--line);
    display:flex; flex-direction:column; align-items:center; justify-content:center; gap:8px;
    color:var(--ink-faint); cursor:pointer; text-align:center; padding:10px;
    transition:border-color .25s ease, color .25s ease, background .25s ease;
  }
  .upload-tile:hover{ border-color:var(--glow-soft); color:var(--ink-dim); background:rgba(255,255,255,0.03); }
  .upload-tile svg{ width:26px; height:26px; stroke:currentColor; fill:none; stroke-width:1.5; }
  .upload-tile span{ font-size:11.5px; letter-spacing:0.02em; }
  .upload-tile.uploading{ opacity:0.6; pointer-events:none; }

  /* ---- lightbox ---- */
  .lightbox-overlay{
    display:none; position:fixed; inset:0; background:rgba(2,3,8,0.94);
    z-index:60; align-items:center; justify-content:center; padding:24px;
  }
  .lightbox-overlay.show{ display:flex; }
  .lightbox-overlay img{
    max-width:100%; max-height:100%; object-fit:contain; border-radius:6px;
  }
  .lightbox-close{
    position:absolute; top:18px; right:20px; width:42px; height:42px; border-radius:12px;
    background:rgba(255,255,255,0.08); border:1px solid var(--line); color:#fff;
    font-size:22px; line-height:1; cursor:pointer;
  }

  footer{ padding:60px 0 10px; text-align:center; }
  .footer-sub{ font-size:11.5px; letter-spacing:0.15em; text-transform:uppercase; color:var(--ink-faint); opacity:0.6; }
</style>
</head>
<body>

<main class="wrap">

  <div class="topbar">
    <a class="back-link" href="index.html">
      <svg viewBox="0 0 24 24"><path d="M11 4L5 10l6 6M5 10h14"/></svg>
      Plataforma PH
    </a>
    <div class="auth-slot" id="authSlot"></div>
  </div>

  <header class="hero">
    <span class="eyebrow">Sitio Paul Harris</span>
    <span class="title-main">Recordatorios</span>
  </header>

  <div class="toolbar">
    <button class="btn btn-edit" id="editBtn" style="display:none;">EDITAR</button>
  </div>

  <div class="section-label">Recordatorios Nuevos</div>
  <div class="photo-grid" id="gridNuevos"></div>

  <div class="section-label">Recordatorios Anteriores</div>
  <div class="photo-grid" id="gridAnteriores"></div>

  <footer><div class="footer-sub">Plataforma PH</div></footer>
</main>

<input type="file" id="fileInputNuevos" accept="image/*" multiple style="display:none;">
<input type="file" id="fileInputAnteriores" accept="image/*" multiple style="display:none;">

<div class="lightbox-overlay" id="lightboxOverlay">
  <button class="lightbox-close" id="lightboxClose">&times;</button>
  <img id="lightboxImg" src="" alt="">
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getAuth, onAuthStateChanged, setPersistence, browserLocalPersistence } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
import {
  getStorage, ref, listAll, getDownloadURL, getMetadata, uploadBytes, deleteObject
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-storage.js";
import { firebaseConfig } from "./assets/js/firebase-config.js";
import { isEditor } from "./assets/js/editors.js";

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
setPersistence(auth, browserLocalPersistence);
const storage = getStorage(app);

const CATEGORIES = {
  nuevos: { folder: "recordatorios/nuevos", gridId: "gridNuevos", inputId: "fileInputNuevos" },
  anteriores: { folder: "recordatorios/anteriores", gridId: "gridAnteriores", inputId: "fileInputAnteriores" },
};

let editorAllowed = false;
let editMode = false;

const editBtn = document.getElementById("editBtn");
const lightboxOverlay = document.getElementById("lightboxOverlay");
const lightboxImg = document.getElementById("lightboxImg");
const lightboxClose = document.getElementById("lightboxClose");

/* =========================================================================
   AUTENTICACIÓN Y PERMISOS
   ========================================================================= */
onAuthStateChanged(auth, async (user) => {
  if (user){
    editorAllowed = await isEditor(app, user, "recordatorios");
    editBtn.style.display = editorAllowed ? "" : "none";
  }
  await loadAll();
});

editBtn.addEventListener("click", () => {
  editMode = !editMode;
  editBtn.textContent = editMode ? "Listo" : "EDITAR";
  editBtn.classList.toggle("active", editMode);
  renderAll();
});

/* =========================================================================
   CARGA DE FOTOS DESDE FIREBASE STORAGE
   ========================================================================= */
let photosCache = { nuevos: [], anteriores: [] };

async function loadCategory(key){
  const { folder } = CATEGORIES[key];
  const listRef = ref(storage, folder);
  const res = await listAll(listRef);
  const items = await Promise.all(res.items.map(async (itemRef) => {
    const [url, meta] = await Promise.all([getDownloadURL(itemRef), getMetadata(itemRef)]);
    return { ref: itemRef, url, name: itemRef.name, time: meta.timeCreated };
  }));
  items.sort((a, b) => new Date(b.time) - new Date(a.time));
  photosCache[key] = items;
}

async function loadAll(){
  try{
    await Promise.all([loadCategory("nuevos"), loadCategory("anteriores")]);
  } catch (err){
    console.error("No se pudieron cargar los recordatorios:", err);
  }
  renderAll();
}

/* =========================================================================
   RENDER
   ========================================================================= */
function renderAll(){
  renderGrid("nuevos");
  renderGrid("anteriores");
}

function renderGrid(key){
  const { gridId } = CATEGORIES[key];
  const grid = document.getElementById(gridId);
  const items = photosCache[key];
  const otherKey = key === "nuevos" ? "anteriores" : "nuevos";

  let html = items.map(item => `
    <div class="photo-tile" data-url="${item.url}">
      <img src="${item.url}" alt="Recordatorio" loading="lazy">
      ${editMode ? `
        <div class="photo-actions">
          <button class="move-btn" data-name="${item.name}" data-from="${key}" data-to="${otherKey}" title="Mover a ${otherKey === "nuevos" ? "Nuevos" : "Anteriores"}" type="button">
            <svg viewBox="0 0 24 24"><path d="M7 7h10M7 7l4-4M7 7l4 4M17 17H7M17 17l-4 4M17 17l-4-4"/></svg>
          </button>
          <button class="del-btn" data-name="${item.name}" data-key="${key}" title="Eliminar" type="button">
            <svg viewBox="0 0 24 24"><path d="M4 7h16M9 7V4h6v3M6 7l1 14h10l1-14"/></svg>
          </button>
        </div>
      ` : ""}
    </div>
  `).join("");

  if (editMode){
    html += `
      <div class="upload-tile" id="uploadTile-${key}">
        <svg viewBox="0 0 24 24"><path d="M12 4v12M6 10l6-6 6 6"/><path d="M4 20h16"/></svg>
        <span>Agregar foto</span>
      </div>
    `;
  }

  if (!html){
    html = `<div class="empty-state">${editMode ? "Todavía no hay fotos aquí. Usa \u201c+ Agregar foto\u201d." : "Todavía no hay recordatorios en esta sección."}</div>`;
  }

  grid.innerHTML = html;

  grid.querySelectorAll(".photo-tile img").forEach(img => {
    img.addEventListener("click", () => openLightbox(img.closest(".photo-tile").dataset.url));
  });
  grid.querySelectorAll(".del-btn").forEach(btn => {
    btn.addEventListener("click", (e) => { e.stopPropagation(); deletePhoto(btn.dataset.key, btn.dataset.name); });
  });
  grid.querySelectorAll(".move-btn").forEach(btn => {
    btn.addEventListener("click", (e) => { e.stopPropagation(); movePhoto(btn.dataset.from, btn.dataset.to, btn.dataset.name); });
  });

  const uploadTile = document.getElementById(`uploadTile-${key}`);
  if (uploadTile){
    uploadTile.addEventListener("click", () => document.getElementById(CATEGORIES[key].inputId).click());
  }
}

/* =========================================================================
   LIGHTBOX (ver a pantalla completa)
   ========================================================================= */
function openLightbox(url){
  lightboxImg.src = url;
  lightboxOverlay.classList.add("show");
}
function closeLightbox(){
  lightboxOverlay.classList.remove("show");
  lightboxImg.src = "";
}
lightboxClose.addEventListener("click", closeLightbox);
lightboxOverlay.addEventListener("click", (e) => { if (e.target === lightboxOverlay) closeLightbox(); });

/* =========================================================================
   SUBIR FOTOS (comprime a un tamaño razonable antes de subir)
   ========================================================================= */
async function resizeImage(file, maxSize = 1600, quality = 0.85){
  try{
    const bitmap = await createImageBitmap(file);
    let { width, height } = bitmap;
    if (width > maxSize || height > maxSize){
      const scale = maxSize / Math.max(width, height);
      width = Math.round(width * scale);
      height = Math.round(height * scale);
    }
    const canvas = document.createElement("canvas");
    canvas.width = width; canvas.height = height;
    canvas.getContext("2d").drawImage(bitmap, 0, 0, width, height);
    const blob = await new Promise(resolve => canvas.toBlob(resolve, "image/jpeg", quality));
    return blob || file;
  } catch (err){
    console.warn("No se pudo comprimir la imagen, se sube tal cual:", err);
    return file;
  }
}

async function uploadPhotos(key, files){
  const { folder, gridId } = CATEGORIES[key];
  const grid = document.getElementById(gridId);
  const uploadTile = document.getElementById(`uploadTile-${key}`);
  if (uploadTile) uploadTile.classList.add("uploading");

  for (const file of files){
    try{
      const blob = await resizeImage(file);
      const filename = `${Date.now()}-${Math.random().toString(16).slice(2)}.jpg`;
      const fileRef = ref(storage, `${folder}/${filename}`);
      await uploadBytes(fileRef, blob, { contentType: "image/jpeg" });
    } catch (err){
      console.error("No se pudo subir una foto:", err);
      alert("No se pudo subir una de las fotos. Revisa tu conexión e inténtalo de nuevo.");
    }
  }

  await loadCategory(key);
  renderAll();
}

Object.keys(CATEGORIES).forEach(key => {
  const input = document.getElementById(CATEGORIES[key].inputId);
  input.addEventListener("change", () => {
    if (input.files.length) uploadPhotos(key, Array.from(input.files));
    input.value = "";
  });
});

/* =========================================================================
   ELIMINAR
   ========================================================================= */
async function deletePhoto(key, name){
  if (!confirm("¿Eliminar esta foto? No se puede deshacer.")) return;
  try{
    await deleteObject(ref(storage, `${CATEGORIES[key].folder}/${name}`));
    await loadCategory(key);
    renderAll();
  } catch (err){
    console.error("No se pudo eliminar la foto:", err);
    alert("No se pudo eliminar la foto.");
  }
}

/* =========================================================================
   MOVER entre "Nuevos" y "Anteriores"
   ========================================================================= */
async function movePhoto(fromKey, toKey, name){
  try{
    const fromRef = ref(storage, `${CATEGORIES[fromKey].folder}/${name}`);
    const url = await getDownloadURL(fromRef);
    const blob = await (await fetch(url)).blob();
    const toRef = ref(storage, `${CATEGORIES[toKey].folder}/${name}`);
    await uploadBytes(toRef, blob, { contentType: "image/jpeg" });
    await deleteObject(fromRef);
    await Promise.all([loadCategory(fromKey), loadCategory(toKey)]);
    renderAll();
  } catch (err){
    console.error("No se pudo mover la foto:", err);
    alert("No se pudo mover la foto.");
  }
}
</script>

</body>
</html>
