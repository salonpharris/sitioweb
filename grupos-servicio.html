<!DOCTYPE html>
<html lang="es" class="auth-pending">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Grupos de Servicio — Paul Harris</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,500;1,500;1,600&family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<script type="module" src="assets/js/auth-guard.js"></script>
<style>
  html.auth-pending{ visibility:hidden; }

  /* =====================================================
     Mismos tokens visuales que el sitio madre (Sitio PH)
     ===================================================== */
  :root{
    --bg-0:#04050c;
    --bg-1:#0a1030;
    --bg-2:#161f5c;
    --bg-3:#2b3bb0;
    --bg-4:#3f4fe0;
    --glow:#6d86ff;
    --glow-soft:#7fa0ff;
    --ink:#f4f5fb;
    --ink-dim:#aeb6e0;
    --ink-faint:#7078a8;
    --line: rgba(255,255,255,0.10);
    --card: rgba(255,255,255,0.045);
    --card-hover: rgba(255,255,255,0.09);
    --radius: 14px;
    --serif: 'Playfair Display', serif;
    --sans: 'Outfit', sans-serif;
  }

  *{box-sizing:border-box; margin:0; padding:0;}
  html{scroll-behavior:smooth;}

  body{
    font-family:var(--sans);
    background:
      radial-gradient(ellipse 120% 60% at 50% -10%, #0e1650 0%, transparent 55%),
      linear-gradient(115deg, var(--bg-0) 0%, var(--bg-1) 28%, var(--bg-2) 55%, var(--bg-3) 78%, var(--bg-4) 100%);
    background-attachment: fixed;
    color:var(--ink);
    min-height:100vh;
    overflow-x:hidden;
    -webkit-font-smoothing:antialiased;
  }

  @media (prefers-reduced-motion: reduce){
    *{animation-duration:0.001ms !important; animation-iteration-count:1 !important; transition-duration:0.001ms !important;}
  }

  a{color:inherit; text-decoration:none;}
  button{font-family:inherit;}

  :focus-visible{
    outline:2px solid var(--glow-soft);
    outline-offset:3px;
    border-radius:8px;
  }

  .wrap{
    max-width:720px;
    margin:0 auto;
    padding:0 28px 80px;
  }
  @media (min-width:900px){ .wrap{ max-width:800px; padding:0 40px 90px; } }
  @media (min-width:1280px){ .wrap{ max-width:860px; } }

  /* =====================================================
     BLOOM — mismo elemento firma del sitio madre, en versión
     compacta para esta página interior.
     ===================================================== */
  .bloom{
    position:relative;
    width:min(360px, 80vw);
    height:min(360px, 80vw);
    margin:0 auto;
  }
  .bloom::before, .bloom::after{
    content:"";
    position:absolute; inset:0;
    border-radius:50%;
    filter:blur(40px);
  }
  .bloom::before{
    background:
      radial-gradient(circle at 30% 30%, rgba(125,150,255,0.5), transparent 60%),
      radial-gradient(circle at 68% 40%, rgba(95,115,240,0.45), transparent 58%),
      radial-gradient(circle at 50% 68%, rgba(70,90,210,0.4), transparent 60%);
    animation: breathe 9s ease-in-out infinite;
  }
  .bloom::after{
    background: radial-gradient(circle at 50% 50%, rgba(200,210,255,0.32), transparent 55%);
    animation: breathe 9s ease-in-out infinite reverse;
    animation-delay:-3s;
  }
  @keyframes breathe{
    0%,100%{ transform:scale(1); opacity:0.85; }
    50%{ transform:scale(1.08); opacity:1; }
  }

  /* =====================================================
     HEADER
     ===================================================== */
  .topbar{
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:26px 0 0;
  }
  .back-link{
    display:inline-flex;
    align-items:center;
    gap:8px;
    font-size:12.5px;
    letter-spacing:0.08em;
    text-transform:uppercase;
    color:var(--ink-faint);
    transition:color 0.25s ease;
  }
  .back-link:hover{ color:var(--ink-dim); }
  .back-link svg{ width:15px; height:15px; stroke:currentColor; fill:none; stroke-width:1.6; }

  .auth-slot{ display:flex; align-items:center; gap:12px; }
  .auth-user{ display:flex; flex-direction:column; align-items:flex-end; line-height:1.35; }
  .auth-name{ font-size:12.5px; color:var(--ink-dim); }
  .auth-email{ font-size:10.5px; color:var(--ink-faint); }
  .auth-logout{
    font-family:var(--sans);
    font-size:12px;
    letter-spacing:0.05em;
    color:var(--ink-dim);
    background:rgba(255,255,255,0.06);
    border:1px solid var(--line);
    border-radius:999px;
    padding:7px 14px;
    cursor:pointer;
    transition: background 0.25s ease, border-color 0.25s ease;
  }
  .auth-logout:hover, .auth-logout:focus-visible{ background:var(--card-hover); border-color:rgba(255,255,255,0.22); }

  .hero{
    position:relative;
    padding:20px 0 24px;
    text-align:center;
  }
  .hero-inner{
    position:absolute; inset:0;
    display:flex; align-items:center; justify-content:center;
    pointer-events:none;
  }
  .hero-text{ position:relative; z-index:2; }
  .eyebrow{
    font-family:var(--serif);
    font-style:italic;
    font-weight:500;
    font-size:clamp(18px, 4.4vw, 22px);
    color:var(--ink-dim);
    display:block;
  }
  .title-main{
    font-family:var(--sans);
    font-weight:600;
    font-size:clamp(30px, 7vw, 44px);
    letter-spacing:-0.01em;
    margin-top:2px;
    display:block;
    background:linear-gradient(180deg, #ffffff 0%, #c9d3ff 100%);
    -webkit-background-clip:text; background-clip:text; color:transparent;
  }

  /* =====================================================
     BUSCADOR
     ===================================================== */
  .search-wrap{
    position:relative;
    margin:30px 0 8px;
  }
  .search-box{
    width:100%;
    display:flex;
    align-items:center;
    gap:12px;
    padding:16px 18px;
    background:var(--card);
    border:1px solid var(--line);
    border-radius:var(--radius);
    backdrop-filter: blur(10px);
    transition:border-color 0.25s ease, background 0.25s ease;
  }
  .search-box:focus-within{
    border-color: rgba(255,255,255,0.26);
    background:var(--card-hover);
  }
  .search-box svg{ width:18px; height:18px; stroke:var(--ink-faint); fill:none; stroke-width:1.6; flex-shrink:0; }
  .search-input{
    flex:1;
    background:transparent;
    border:none;
    outline:none;
    color:var(--ink);
    font-family:var(--sans);
    font-size:15px;
  }
  .search-input::placeholder{ color:var(--ink-faint); }
  .search-clear{
    display:none;
    color:var(--ink-faint);
    font-size:12px;
    letter-spacing:0.05em;
    text-transform:uppercase;
    cursor:pointer;
  }
  .search-clear.show{ display:block; }

  .search-results{
    margin-top:8px;
    border:1px solid var(--line);
    border-radius:var(--radius);
    background:var(--card);
    backdrop-filter: blur(10px);
    overflow:hidden;
    display:none;
  }
  .search-results.show{ display:block; }
  .result-row{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:14px;
    padding:13px 18px;
    border-bottom:1px solid var(--line);
    cursor:pointer;
    transition: background 0.2s ease;
  }
  .result-row:last-child{ border-bottom:none; }
  .result-row:hover, .result-row:focus-visible{ background:var(--card-hover); }
  .result-name{ font-size:14px; font-weight:500; color:var(--ink); }
  .result-role{ font-size:11px; color:var(--ink-faint); letter-spacing:0.03em; margin-top:2px; }
  .result-group{
    flex-shrink:0;
    font-size:12px;
    font-weight:600;
    color:var(--glow-soft);
    background:rgba(127,160,255,0.12);
    padding:5px 11px;
    border-radius:999px;
  }
  .result-empty{
    padding:18px;
    text-align:center;
    color:var(--ink-faint);
    font-size:13.5px;
  }

  /* =====================================================
     GRILLA DE GRUPOS (vista inicial)
     ===================================================== */
  .section-label{
    font-size:12px;
    letter-spacing:0.22em;
    text-transform:uppercase;
    color:var(--ink-faint);
    font-weight:500;
    margin:40px 0 16px;
    display:flex; align-items:center; gap:12px;
  }
  .section-label::after{
    content:""; flex:1; height:1px;
    background:linear-gradient(90deg, var(--line), transparent);
  }

  .group-grid{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:14px;
  }
  .group-card{
    display:flex;
    flex-direction:column;
    align-items:flex-start;
    gap:6px;
    text-align:left;
    padding:24px 20px;
    background:var(--card);
    border:1px solid var(--line);
    border-radius:var(--radius);
    backdrop-filter: blur(10px);
    cursor:pointer;
    transition: background 0.3s ease, transform 0.3s ease, border-color 0.3s ease;
  }
  .group-card:hover, .group-card:focus-visible{
    background:var(--card-hover);
    border-color: rgba(255,255,255,0.22);
    transform: translateY(-3px);
  }
  .group-num{
    font-family:var(--sans);
    font-weight:600;
    font-size:26px;
    color:var(--ink);
  }
  .group-count{
    font-size:12px;
    color:var(--ink-faint);
    margin-top:2px;
  }

  .session-email{
    font-family:var(--sans);
    font-weight:600;
    font-size:14.5px;
    color:var(--ink);
    word-break:break-word;
    overflow-wrap:anywhere;
  }

  #sessionFooter{ grid-template-columns:1fr; }

  @media (min-width:900px){
    .group-card{ padding:30px 22px; }
  }

  /* =====================================================
     VISTA DE DETALLE DE GRUPO
     ===================================================== */
  #view-group{ display:none; }
  #view-group.show{ display:block; }
  #view-home.hide{ display:none; }

  .group-detail-head{
    display:flex;
    align-items:center;
    justify-content:space-between;
    margin:34px 0 22px;
  }
  .group-detail-title{
    font-family:var(--serif);
    font-style:italic;
    font-size:clamp(26px, 6vw, 34px);
    color:var(--ink);
  }
  .group-detail-meta{
    display:flex;
    gap:24px;
    margin-bottom:26px;
    flex-wrap:wrap;
  }
  .meta-item{ font-size:13px; color:var(--ink-dim); }
  .meta-item b{ color:var(--ink); font-weight:600; display:block; font-size:11px; letter-spacing:0.1em; text-transform:uppercase; color:var(--ink-faint); margin-bottom:3px; font-weight:500; }

  .member-list{
    columns:2;
    column-gap:0;
    column-rule:1px solid var(--line);
    border:1px solid var(--line);
    border-radius:var(--radius);
    overflow:hidden;
  }
  .member-row{
    break-inside:avoid;
    padding:14px 18px;
    background:rgba(255,255,255,0.02);
    font-size:16px;
    color:var(--ink-dim);
    border-bottom:1px solid var(--line);
    transition: background 0.4s ease, color 0.4s ease;
  }
  .member-row.highlight{
    background: rgba(127,160,255,0.18);
    color:var(--ink);
  }

  @media (max-width:520px){
    .member-list{ columns:1; }
  }

  .back-btn{
    display:inline-flex;
    align-items:center;
    gap:8px;
    font-size:12.5px;
    letter-spacing:0.08em;
    text-transform:uppercase;
    color:var(--ink-faint);
    padding:10px 4px;
    cursor:pointer;
    transition:color 0.25s ease;
  }
  .back-btn:hover{ color:var(--ink-dim); }
  .back-btn svg{ width:15px; height:15px; stroke:currentColor; fill:none; stroke-width:1.6; }

  footer{ padding:60px 0 10px; text-align:center; }
  .footer-sub{
    font-size:11.5px;
    letter-spacing:0.15em;
    text-transform:uppercase;
    color:var(--ink-faint);
    opacity:0.6;
  }
</style>
</head>
<body>

<main class="wrap">

  <div class="topbar">
    <a class="back-link" href="index.html">
      <svg viewBox="0 0 24 24"><path d="M11 4L5 10l6 6M5 10h14"/></svg>
      Plataforma PH
    </a>
    <div class="auth-slot" id="authSlot"></div>
  </div>

  <!-- ============ VISTA INICIAL ============ -->
  <div id="view-home">
    <header class="hero">
      <div class="hero-inner"><div class="bloom" aria-hidden="true"></div></div>
      <div class="hero-text">
        <span class="eyebrow">Sitio Paul Harris</span>
        <span class="title-main">Grupos de Servicio</span>
      </div>
    </header>

    <div class="search-wrap">
      <div class="search-box">
        <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="M20 20l-4-4"/></svg>
        <input class="search-input" id="searchInput" type="text" placeholder="Buscar por nombre o apellido…" autocomplete="off">
        <span class="search-clear" id="searchClear">Borrar</span>
      </div>
      <div class="search-results" id="searchResults"></div>
    </div>

    <div class="section-label">Selecciona un grupo</div>
    <div class="group-grid" id="groupGrid"><!-- se llena con JS desde CONFIG --></div>

    <div class="section-label">Sesión</div>
    <div class="group-grid" id="sessionFooter"><!-- se llena con JS --></div>
  </div>

  <!-- ============ VISTA DE DETALLE ============ -->
  <div id="view-group">
    <div class="back-btn" id="backBtn">
      <svg viewBox="0 0 24 24"><path d="M11 4L5 10l6 6M5 10h14"/></svg>
      Volver a Grupos de Servicio
    </div>

    <div class="group-detail-head">
      <div class="group-detail-title" id="detailTitle"></div>
    </div>
    <div class="group-detail-meta" id="detailMeta"></div>
    <div class="member-list" id="detailMembers"></div>
  </div>

  <footer>
    <div class="footer-sub">Plataforma PH</div>
  </footer>

</main>

<script>
/* =========================================================================
   CONFIGURACIÓN — EDITA AQUÍ
   Cada grupo tiene su superintendente, auxiliar y lista de integrantes.
   Para agregar, quitar o mover a alguien, edita directamente estos arreglos.
   ========================================================================= */
const GROUPS = [
  {
    id: 1,
    supervisor: "Corrales Elías",
    auxiliar: "Angulo René",
    members: ["Angulo Josué","Angulo Selva","Bascuñan Jeanette","Carril Matías","Castro Yenny","Conde Hadita","Corrales Nicole","Fuentes Elizabeth","García Flor","García Rodrigo","Mandamientos María","Méndez Teresa","Mondaca Esther","Muñoz Aida","Poblete Julio","Recoba Cristina","Torrejón César","Torrejón Irene"]
  },
  {
    id: 2,
    supervisor: "Acosta Carlos",
    auxiliar: "Lillo Hugo",
    members: ["Acosta Flor","Acosta Norma","Apablaza María","Bastías Margarita","Berrios Francisco","Guajardo Fabricio","Ibarra Jaime","Ibarra Mariana","Klaue Isabella","Klaue Nicole","Lucero Ana María","Morales Luis","Navarrete Paula","Olea Giselle","Piña Irenia","Pulido Mateo","Sánchez Francisca","Vallejos Patricia","Vidal Carmen"]
  },
  {
    id: 3,
    supervisor: "Lea-Plaza Pablo",
    auxiliar: "Bravo Gabriel",
    members: ["Achondo Salvador","Álvarez Carolina","Bravo Alexia","Caro Cecilia","Cerda Yasna","Fuentealba Mauricio","Fuentealba Verónica","Jería Hortensia","Lea-Plaza Irma","Musalem Verónica","Navarro Karina","Palma Angélica","Pérez Mª Elena","Ramírez Susy","Sánchez Epifanía","Sepúlveda Isidora","Sepúlveda Verónica","Ugarte Ceferina","Zara Elizabeth","Zara Mª Francisca"]
  },
  {
    id: 4,
    supervisor: "Castillo Andrés",
    auxiliar: "Cobano Francisco",
    members: ["Becerra Alejandra","Becerra Ricardo","Castillo Sandra","Contreras Andrés","Contreras Milena","Espinoza Patricia","González Angélica","Leficura Mª Teresa","López Gladys","López Inés","Morales Javiera","Morales Matías","Schuldt Cheryl","Schuldt Robert","Suárez Kendryk","Verdugo Carmen","Verdugo Carmen Glo","Vidal Lucy","Vidal Pilar"]
  },
  {
    id: 5,
    supervisor: "Véliz Miguel Ángel",
    auxiliar: "García Jaír",
    members: ["Aine Lovena","Araya Marjorie","Barrera Elizabeth","Barrera Pablo","Bravo Norma","Canales Daniela","Cárdenas Elizabeth","Castañeda Rosario","Cornejo Elsa","Cornejo Linda","Cornejo Miguel","Cornejo Patricia","Díaz Carmen","Gutiérrez Alicia","Iriarte Isabel","Lillo Álvaro","Martínez Karin","Rivera Rosa","Véliz Andrea","Vera Julieta","Vicuña Carmen","Vicuña Nicolás"]
  },
  {
    id: 6,
    supervisor: "Donoso Rafael",
    auxiliar: "Ramírez Jorge",
    members: ["Ahumada Dominga","Ahumada Vicente","Álvarez Myriam","Donoso Martín","Donoso Natalia","Espinoza Claudia","Ferreira Lukas","Ferreira Victoria","Gavidia Marina","Hidalgo Norma","Jordán Rosario","Lucero Sebastián","Mina Santiago","Pavéz Verónica","Ramirez Florencia","Ramírez Natalia","Villalón Norma"]
  }
];

/* =========================================================================
   ÍNDICE DE BÚSQUEDA — se construye solo, no editar a mano.
   Incluye integrantes, superintendentes y auxiliares.
   ========================================================================= */
function normalize(str){
  return str.normalize("NFD").replace(/[\u0300-\u036f]/g, "").toLowerCase().trim();
}

const SEARCH_INDEX = [];
GROUPS.forEach(g => {
  g.members.forEach(name => SEARCH_INDEX.push({ name, role: "Integrante", groupId: g.id }));
  SEARCH_INDEX.push({ name: g.supervisor, role: "Superintendente", groupId: g.id });
  SEARCH_INDEX.push({ name: g.auxiliar, role: "Auxiliar", groupId: g.id });
});

/* =========================================================================
   RENDER — vista inicial: grilla de grupos
   ========================================================================= */
const groupGrid = document.getElementById("groupGrid");
groupGrid.innerHTML = GROUPS.map(g => `
  <div class="group-card" data-group="${g.id}" tabindex="0" role="button">
    <span class="group-num">Grupo ${g.id}</span>
    <span class="group-count">${g.members.length + 2} personas</span>
  </div>
`).join("");

groupGrid.querySelectorAll(".group-card").forEach(card => {
  card.addEventListener("click", () => openGroup(parseInt(card.dataset.group), null));
  card.addEventListener("keydown", e => {
    if (e.key === "Enter" || e.key === " "){ e.preventDefault(); openGroup(parseInt(card.dataset.group), null); }
  });
});

/* =========================================================================
   BUSCADOR
   ========================================================================= */
const searchInput = document.getElementById("searchInput");
const searchResults = document.getElementById("searchResults");
const searchClear = document.getElementById("searchClear");

searchInput.addEventListener("input", () => {
  const q = normalize(searchInput.value);
  searchClear.classList.toggle("show", q.length > 0);

  if (q.length < 2){
    searchResults.classList.remove("show");
    searchResults.innerHTML = "";
    return;
  }

  const matches = SEARCH_INDEX.filter(p => normalize(p.name).includes(q)).slice(0, 8);

  if (matches.length === 0){
    searchResults.innerHTML = `<div class="result-empty">No se encontró a nadie con ese nombre.</div>`;
  } else {
    searchResults.innerHTML = matches.map(p => `
      <div class="result-row" data-group="${p.groupId}" data-name="${p.name}" tabindex="0" role="button">
        <div>
          <div class="result-name">${p.name}</div>
          <div class="result-role">${p.role}</div>
        </div>
        <span class="result-group">Grupo ${p.groupId}</span>
      </div>
    `).join("");
  }
  searchResults.classList.add("show");

  searchResults.querySelectorAll(".result-row").forEach(row => {
    row.addEventListener("click", () => openGroup(parseInt(row.dataset.group), row.dataset.name));
  });
});

searchClear.addEventListener("click", () => {
  searchInput.value = "";
  searchInput.focus();
  searchClear.classList.remove("show");
  searchResults.classList.remove("show");
  searchResults.innerHTML = "";
});

/* =========================================================================
   VISTA DE DETALLE DE GRUPO
   ========================================================================= */
const viewHome = document.getElementById("view-home");
const viewGroup = document.getElementById("view-group");
const detailTitle = document.getElementById("detailTitle");
const detailMeta = document.getElementById("detailMeta");
const detailMembers = document.getElementById("detailMembers");
const backBtn = document.getElementById("backBtn");

function openGroup(groupId, highlightName){
  const g = GROUPS.find(x => x.id === groupId);
  if (!g) return;

  detailTitle.textContent = "Grupo " + g.id;
  detailMeta.innerHTML = `
    <div class="meta-item"><b>Superintendente</b>${g.supervisor}</div>
    <div class="meta-item"><b>Auxiliar</b>${g.auxiliar}</div>
    <div class="meta-item"><b>Integrantes</b>${g.members.length}</div>
  `;
  const sortedMembers = [...g.members].sort((a, b) =>
    a.localeCompare(b, "es", { sensitivity: "base" })
  );

  detailMembers.innerHTML = sortedMembers.map(name => `
    <div class="member-row" data-name="${name}">${name}</div>
  `).join("");

  viewHome.classList.add("hide");
  viewGroup.classList.add("show");
  window.scrollTo({ top: 0, behavior: "smooth" });

  if (highlightName){
    setTimeout(() => {
      const row = [...detailMembers.querySelectorAll(".member-row")]
        .find(r => r.dataset.name === highlightName);
      if (row){
        row.classList.add("highlight");
        row.scrollIntoView({ behavior:"smooth", block:"center" });
      }
    }, 200);
  }
}

backBtn.addEventListener("click", () => {
  viewGroup.classList.remove("show");
  viewHome.classList.remove("hide");
  searchInput.value = "";
  searchClear.classList.remove("show");
  searchResults.classList.remove("show");
  searchResults.innerHTML = "";
  window.scrollTo({ top: 0, behavior: "smooth" });
});
</script>

</body>
</html>
