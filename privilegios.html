<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="manifest" href="manifest.json">
<link rel="icon" type="image/png" sizes="32x32" href="assets/icons/favicon-32.png">
<link rel="icon" type="image/png" sizes="16x16" href="assets/icons/favicon-16.png">
<link rel="apple-touch-icon" href="assets/icons/apple-touch-icon.png">
<link rel="apple-touch-icon" sizes="152x152" href="assets/icons/apple-touch-icon-152.png">
<link rel="apple-touch-icon" sizes="167x167" href="assets/icons/apple-touch-icon-167.png">
<meta name="theme-color" content="#0a1030">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Sitio PH">
<title>Privilegios — Paul Harris</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,500;1,500;1,600&family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<script type="module" src="assets/js/auth-guard.js"></script>
<style>
  html.auth-pending{ visibility:hidden; }

  :root{
    --bg-0:#04050c; --bg-1:#0a1030; --bg-2:#161f5c; --bg-3:#2b3bb0; --bg-4:#3f4fe0;
    --glow:#6d86ff; --glow-soft:#7fa0ff;
    --ink:#f4f5fb; --ink-dim:#aeb6e0; --ink-faint:#7078a8;
    --line: rgba(255,255,255,0.10);
    --card: rgba(255,255,255,0.045);
    --card-hover: rgba(255,255,255,0.09);
    --radius:14px;
    --red:#e0503f;
    --red-soft:rgba(224,80,63,0.14);
    --serif:'Playfair Display', serif;
    --sans:'Outfit', sans-serif;
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  html{scroll-behavior:smooth;}
  body{
    font-family:var(--sans);
    background:
      radial-gradient(ellipse 120% 60% at 50% -10%, #0e1650 0%, transparent 55%),
      linear-gradient(115deg, var(--bg-0) 0%, var(--bg-1) 28%, var(--bg-2) 55%, var(--bg-3) 78%, var(--bg-4) 100%);
    background-attachment: fixed;
    color:var(--ink);
    min-height:100vh;
    -webkit-font-smoothing:antialiased;
  }
  a{color:inherit; text-decoration:none;}
  button{font-family:inherit;}
  :focus-visible{ outline:2px solid var(--glow-soft); outline-offset:3px; border-radius:8px; }

  .wrap{ max-width:760px; margin:0 auto; padding:0 24px 90px; }
  @media (min-width:900px){ .wrap{ max-width:860px; padding:0 40px 100px; } }

  .topbar{ display:flex; align-items:center; justify-content:space-between; padding:26px 0 0; }
  .back-link{ display:inline-flex; align-items:center; gap:8px; font-size:12.5px; letter-spacing:0.08em; text-transform:uppercase; color:var(--ink-faint); }
  .back-link:hover{ color:var(--ink-dim); }
  .back-link svg{ width:15px; height:15px; stroke:currentColor; fill:none; stroke-width:1.6; }
  .auth-slot{ display:flex; align-items:center; gap:12px; }
  .auth-logout{
    font-family:var(--sans); font-size:12px; letter-spacing:0.05em; color:var(--ink-dim);
    background:rgba(255,255,255,0.06); border:1px solid var(--line); border-radius:999px;
    padding:7px 14px; cursor:pointer; transition:background .25s ease, border-color .25s ease;
  }
  .auth-logout:hover{ background:var(--card-hover); border-color:rgba(255,255,255,.22); }

  .hero{ padding:22px 0 26px; text-align:center; }
  .eyebrow{ font-family:var(--serif); font-style:italic; font-size:20px; color:var(--ink-dim); display:block; }
  .title-main{
    font-weight:600; font-size:clamp(30px,7vw,42px); margin-top:2px; display:block;
    background:linear-gradient(180deg,#fff 0%, #c9d3ff 100%); -webkit-background-clip:text; background-clip:text; color:transparent;
  }

  .toolbar{
    display:flex; align-items:center; gap:12px; flex-wrap:wrap;
    margin-top:24px;
  }
  select.month-select{
    flex:1; min-width:180px;
    background:var(--card); border:1px solid var(--line); border-radius:999px;
    color:var(--ink); font-family:var(--sans); font-size:14px; padding:12px 18px;
  }
  .btn{
    font-family:var(--sans); font-size:13px; font-weight:500; letter-spacing:0.02em;
    padding:11px 18px; border-radius:999px; border:1px solid var(--line);
    background:var(--card); color:var(--ink); cursor:pointer;
    transition:background .25s ease, border-color .25s ease, transform .2s ease;
    white-space:nowrap;
  }
  .btn:hover{ background:var(--card-hover); border-color:rgba(255,255,255,.22); }
  .btn-edit{
    background:var(--red); border-color:var(--red); color:#fff; font-weight:600;
  }
  .btn-edit:hover{ background:#c9432f; }
  .btn-ghost{ background:transparent; }
  .btn-primary{
    background:linear-gradient(180deg,#8fa6ff,#5f78e8); border:none; color:#0a0e2a; font-weight:600;
  }
  .btn-primary:hover{ filter:brightness(1.08); }
  .btn:disabled{ opacity:0.4; cursor:default; }

  .section-label{
    font-size:12px; letter-spacing:0.22em; text-transform:uppercase; color:var(--ink-faint);
    font-weight:500; margin:34px 0 16px; display:flex; align-items:center; gap:12px;
  }
  .section-label::after{ content:""; flex:1; height:1px; background:linear-gradient(90deg,var(--line),transparent); }

  .empty-state{
    padding:40px 24px; text-align:center; color:var(--ink-faint); font-size:14px;
    border:1px dashed var(--line); border-radius:var(--radius);
  }

  /* ---- vista de lectura ---- */
  .date-card{
    background:var(--card); border:1px solid var(--line); border-radius:var(--radius);
    padding:22px 22px 8px; margin-bottom:16px; backdrop-filter:blur(10px);
  }
  .date-title{
    font-family:var(--serif); font-style:italic; font-size:18px; color:var(--ink);
    margin-bottom:16px;
  }
  .role-grid{
    display:grid; grid-template-columns:1fr 1fr; gap:14px 18px;
    margin-bottom:14px;
  }
  @media (min-width:600px){ .role-grid{ grid-template-columns:1fr 1fr 1fr; } }
  .role-item{ }
  .role-name{ font-size:10.5px; letter-spacing:0.1em; text-transform:uppercase; color:var(--ink-faint); margin-bottom:4px; }
  .role-person{ font-size:14px; color:var(--ink); font-weight:500; }
  .role-person.empty{ color:var(--ink-faint); font-weight:400; font-style:italic; }

  /* ---- edición ---- */
  #editArea{ display:none; }
  #editArea.show{ display:block; }
  #viewArea.hide{ display:none; }

  .edit-date-card{
    background:var(--card); border:1px solid var(--line); border-radius:var(--radius);
    padding:20px; margin-bottom:16px;
  }
  .edit-date-head{
    display:flex; align-items:center; gap:10px; margin-bottom:16px;
  }
  .edit-date-head input{
    flex:1; background:rgba(255,255,255,0.05); border:1px solid var(--line); border-radius:10px;
    padding:10px 14px; color:var(--ink); font-family:var(--sans); font-size:14px;
  }
  .icon-btn{
    width:34px; height:34px; flex-shrink:0; border-radius:10px; border:1px solid var(--line);
    background:transparent; color:var(--ink-faint); cursor:pointer; display:flex; align-items:center; justify-content:center;
  }
  .icon-btn:hover{ color:#ff9d9d; border-color:rgba(255,157,157,0.4); }
  .icon-btn svg{ width:16px; height:16px; stroke:currentColor; fill:none; stroke-width:1.7; }

  .edit-role-grid{ display:grid; grid-template-columns:1fr 1fr; gap:12px; }
  @media (min-width:600px){ .edit-role-grid{ grid-template-columns:1fr 1fr 1fr; } }
  .edit-role-field label{ display:block; font-size:10.5px; letter-spacing:0.08em; text-transform:uppercase; color:var(--ink-faint); margin-bottom:5px; }
  .edit-role-field select{
    width:100%; background:rgba(255,255,255,0.05); border:1px solid var(--line); border-radius:10px;
    padding:9px 10px; color:var(--ink); font-family:var(--sans); font-size:13px;
  }

  .edit-actions{ display:flex; gap:10px; flex-wrap:wrap; margin-top:22px; }

  /* ---- modal genérico (vista previa / mensajes / nuevo mes) ---- */
  .modal-overlay{
    display:none; position:fixed; inset:0; background:rgba(4,5,12,0.72);
    z-index:50; align-items:flex-start; justify-content:center; padding:6vh 18px; overflow-y:auto;
    backdrop-filter:blur(4px);
  }
  .modal-overlay.show{ display:flex; }
  .modal-box{
    background:#0d1338; border:1px solid var(--line); border-radius:18px;
    max-width:640px; width:100%; padding:28px 26px; margin-bottom:6vh;
  }
  .modal-title{ font-family:var(--serif); font-style:italic; font-size:20px; margin-bottom:18px; }
  .modal-close{
    float:right; background:none; border:none; color:var(--ink-faint); cursor:pointer; font-size:20px; line-height:1;
  }

  .msg-person{
    border:1px solid var(--line); border-radius:12px; padding:14px 16px; margin-bottom:12px;
  }
  .msg-person-name{ font-weight:600; font-size:14px; margin-bottom:8px; }
  .msg-textarea{
    width:100%; min-height:110px; background:rgba(255,255,255,0.04); border:1px solid var(--line);
    border-radius:10px; padding:10px 12px; color:var(--ink-dim); font-family:var(--sans); font-size:12.5px;
    line-height:1.5; resize:vertical; margin-bottom:10px;
  }
  .msg-actions{ display:flex; gap:8px; flex-wrap:wrap; }
  .msg-actions .btn{ font-size:12px; padding:8px 14px; }

  .template-box{
    width:100%; min-height:100px; background:rgba(255,255,255,0.05); border:1px solid var(--line);
    border-radius:10px; padding:12px 14px; color:var(--ink); font-family:var(--sans); font-size:13px;
    line-height:1.6; margin-bottom:18px;
  }
  .hint{ font-size:12px; color:var(--ink-faint); margin-bottom:16px; line-height:1.5; }

  footer{ padding:60px 0 10px; text-align:center; }
  .footer-sub{ font-size:11.5px; letter-spacing:0.15em; text-transform:uppercase; color:var(--ink-faint); opacity:0.6; }
</style>
</head>
<body>

<main class="wrap">

  <div class="topbar">
    <a class="back-link" href="index.html">
      <svg viewBox="0 0 24 24"><path d="M11 4L5 10l6 6M5 10h14"/></svg>
      Plataforma PH
    </a>
    <div class="auth-slot" id="authSlot"></div>
  </div>

  <header class="hero">
    <span class="eyebrow">Sitio Paul Harris</span>
    <span class="title-main">Privilegios</span>
  </header>

  <div class="toolbar">
    <select class="month-select" id="monthSelect"></select>
    <button class="btn" id="addMonthBtn" style="display:none;">+ Nuevo mes</button>
    <button class="btn btn-edit" id="editBtn" style="display:none;">EDITAR</button>
    <button class="btn" id="alertsBtn" style="display:none;">Enviar alertas</button>
  </div>

  <!-- ===== VISTA DE LECTURA ===== -->
  <div id="viewArea">
    <div id="viewDates"></div>
  </div>

  <!-- ===== VISTA DE EDICIÓN ===== -->
  <div id="editArea">
    <div id="editDates"></div>
    <button class="btn" id="addDateBtn">+ Agregar fecha</button>
    <div class="edit-actions">
      <button class="btn" id="previewBtn">Vista previa</button>
      <button class="btn btn-primary" id="publishBtn">Publicar cambios</button>
      <button class="btn btn-ghost" id="cancelEditBtn">Cancelar</button>
    </div>
  </div>

  <footer><div class="footer-sub">Plataforma PH</div></footer>
</main>

<!-- Modal genérico -->
<div class="modal-overlay" id="modalOverlay">
  <div class="modal-box" id="modalBox"></div>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getAuth, onAuthStateChanged, setPersistence, browserLocalPersistence } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
import {
  getFirestore, collection, doc, getDoc, getDocs, setDoc, query, orderBy
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";
import { firebaseConfig } from "./assets/js/firebase-config.js";
import { isEditor } from "./assets/js/editors.js";

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
setPersistence(auth, browserLocalPersistence);
const db = getFirestore(app);

/* =========================================================================
   CONFIGURACIÓN — EDITA AQUÍ
   Roles del programa y de qué lista de nombres se llena cada uno.
   ========================================================================= */
const ROLES = [
  { key: "acomodadorEntrada", label: "Acomodador Entrada",   list: "acomodador" },
  { key: "acomodadorAuditorio", label: "Acomodador Auditorio", list: "acomodador" },
  { key: "microfono1", label: "Micrófono 1", list: "microfono" },
  { key: "microfono2", label: "Micrófono 2", list: "microfono" },
  { key: "audio", label: "Audio", list: "audioVideo" },
  { key: "video", label: "Vídeo", list: "audioVideo" },
  { key: "plataforma", label: "Plataforma", list: "plataforma" },
];

const NAMES = {
  acomodador: ["Andrés Castillo","Carlos Acosta","Elías Corrales","Francisco Cobano","Gabriel Bravo","Hugo Lillo","Jaír García","Jorge Ramírez","Matías Carril","Miguel Ángel Véliz","Pablo Lea-Plaza","Rafael Donoso","René Angulo","Pablo Barrera","Robert Schuldt"],
  microfono: ["Andrés Contreras","Francisco Cobano","Gabriel Bravo","Jaime Ibarra","Jaír García","Jorge Ramírez","Kendryk Suárez","Lukas Ferreira","Martín Donoso","Matías Carril","Matías Morales","Mateo Pulido","Mauricio Fuentealba","Nicolás Vicuña","Sebastián Lucero","Vicente Ahumada"],
  plataforma: ["Andrés Contreras","Francisco Cobano","Gabriel Bravo","Jaime Ibarra","Jaír García","Jorge Ramírez","Kendryk Suárez","Lukas Ferreira","Martín Donoso","Matías Carril","Matías Morales","Mateo Pulido","Mauricio Fuentealba","Nicolás Vicuña","Sebastián Lucero","Vicente Ahumada"],
  audioVideo: ["Andrés Contreras","Jaír García","Jorge Ramírez","Kendryk Suárez","Lukas Ferreira","Martín Donoso","Matías Carril","Matías Morales","Sebastián Lucero"],
};

const DEFAULT_TEMPLATE =
`Querido/a Hno./Hna. {nombre}, se adjunta el detalle de todos los privilegios que se le han asignado este mes, si no puede estar disponible para alguno de ellos, le pedimos nos avise cuanto antes para hacer los ajustes respectivos, muchas gracias:

{lista}`;

/* =========================================================================
   ESTADO
   ========================================================================= */
let currentUser = null;
let editorAllowed = false;
let months = [];              // [{id, monthLabel}]
let currentMonthId = null;
let currentMonthData = null;  // documento publicado actual
let draftDates = [];          // copia editable en memoria

const monthSelect = document.getElementById("monthSelect");
const addMonthBtn = document.getElementById("addMonthBtn");
const editBtn = document.getElementById("editBtn");
const alertsBtn = document.getElementById("alertsBtn");
const viewArea = document.getElementById("viewArea");
const editArea = document.getElementById("editArea");
const viewDates = document.getElementById("viewDates");
const editDates = document.getElementById("editDates");
const modalOverlay = document.getElementById("modalOverlay");
const modalBox = document.getElementById("modalBox");

function openModal(html){
  modalBox.innerHTML = html;
  modalOverlay.classList.add("show");
}
function closeModal(){ modalOverlay.classList.remove("show"); }
modalOverlay.addEventListener("click", (e) => { if (e.target === modalOverlay) closeModal(); });

/* =========================================================================
   AUTENTICACIÓN Y PERMISOS
   ========================================================================= */
onAuthStateChanged(auth, async (user) => {
  currentUser = user;
  if (user){
    editorAllowed = await isEditor(app, user, "privilegios");
    addMonthBtn.style.display = editorAllowed ? "" : "none";
    editBtn.style.display = editorAllowed ? "" : "none";
    alertsBtn.style.display = editorAllowed ? "" : "none";
  }
  await loadMonths();
});

/* =========================================================================
   CARGA DE MESES DESDE FIRESTORE
   ========================================================================= */
async function loadMonths(){
  const q = query(collection(db, "privilegios"), orderBy("__name__"));
  const snap = await getDocs(q);
  months = [];
  snap.forEach(d => months.push({ id: d.id, ...d.data() }));

  monthSelect.innerHTML = months.map(m => `<option value="${m.id}">${m.monthLabel}</option>`).join("");

  if (months.length === 0){
    currentMonthId = null;
    currentMonthData = null;
    renderView();
    return;
  }

  if (!currentMonthId || !months.find(m => m.id === currentMonthId)){
    currentMonthId = months[months.length - 1].id;
  }
  monthSelect.value = currentMonthId;
  currentMonthData = months.find(m => m.id === currentMonthId);
  renderView();
}

monthSelect.addEventListener("change", () => {
  currentMonthId = monthSelect.value;
  currentMonthData = months.find(m => m.id === currentMonthId);
  exitEditMode();
  renderView();
});

/* =========================================================================
   VISTA DE LECTURA
   ========================================================================= */
function roleLabel(key){ return ROLES.find(r => r.key === key)?.label || key; }

function renderDateCardHTML(d){
  return `
    <div class="date-card">
      <div class="date-title">${d.dayLabel}</div>
      <div class="role-grid">
        ${ROLES.map(r => `
          <div class="role-item">
            <div class="role-name">${r.label}</div>
            <div class="role-person ${d.roles[r.key] ? "" : "empty"}">${d.roles[r.key] || "Sin asignar"}</div>
          </div>
        `).join("")}
      </div>
    </div>
  `;
}

function renderView(){
  if (!currentMonthData || !currentMonthData.dates || currentMonthData.dates.length === 0){
    viewDates.innerHTML = `<div class="empty-state">${months.length === 0 ? "Todavía no hay meses publicados." : "Este mes no tiene fechas cargadas."}${editorAllowed ? " Usa \u201c+ Nuevo mes\u201d o \u201cEDITAR\u201d para agregar el programa." : ""}</div>`;
    return;
  }
  viewDates.innerHTML = currentMonthData.dates.map(renderDateCardHTML).join("");
}

/* =========================================================================
   MODO EDICIÓN
   ========================================================================= */
function enterEditMode(){
  draftDates = currentMonthData && currentMonthData.dates
    ? JSON.parse(JSON.stringify(currentMonthData.dates))
    : [];
  if (draftDates.length === 0) addDraftDate();
  renderEdit();
  viewArea.classList.add("hide");
  editArea.classList.add("show");
}

function exitEditMode(){
  viewArea.classList.remove("hide");
  editArea.classList.remove("show");
}

function addDraftDate(){
  draftDates.push({
    id: "d" + Date.now() + Math.random().toString(16).slice(2),
    dayLabel: "",
    roles: {}
  });
}

function renderEdit(){
  editDates.innerHTML = draftDates.map((d, idx) => `
    <div class="edit-date-card" data-idx="${idx}">
      <div class="edit-date-head">
        <input type="text" class="date-label-input" placeholder="Ej: Martes 2 Septiembre" value="${d.dayLabel}">
        <button class="icon-btn remove-date-btn" title="Eliminar fecha" type="button">
          <svg viewBox="0 0 24 24"><path d="M4 7h16M9 7V4h6v3M6 7l1 14h10l1-14"/></svg>
        </button>
      </div>
      <div class="edit-role-grid">
        ${ROLES.map(r => `
          <div class="edit-role-field">
            <label>${r.label}</label>
            <select data-role="${r.key}">
              <option value="">— Sin asignar —</option>
              ${NAMES[r.list].map(n => `<option value="${n}" ${d.roles[r.key] === n ? "selected" : ""}>${n}</option>`).join("")}
            </select>
          </div>
        `).join("")}
      </div>
    </div>
  `).join("");

  editDates.querySelectorAll(".edit-date-card").forEach(card => {
    const idx = parseInt(card.dataset.idx);

    card.querySelector(".date-label-input").addEventListener("input", (e) => {
      draftDates[idx].dayLabel = e.target.value;
    });
    card.querySelector(".remove-date-btn").addEventListener("click", () => {
      draftDates.splice(idx, 1);
      renderEdit();
    });
    card.querySelectorAll("select[data-role]").forEach(sel => {
      sel.addEventListener("change", () => {
        draftDates[idx].roles[sel.dataset.role] = sel.value;
      });
    });
  });
}

editBtn.addEventListener("click", enterEditMode);
document.getElementById("addDateBtn").addEventListener("click", () => { addDraftDate(); renderEdit(); });
document.getElementById("cancelEditBtn").addEventListener("click", exitEditMode);

document.getElementById("previewBtn").addEventListener("click", () => {
  const previewHTML = draftDates.length
    ? draftDates.map(renderDateCardHTML).join("")
    : `<div class="empty-state">No hay fechas para mostrar.</div>`;
  openModal(`
    <button class="modal-close" id="modalCloseBtn">&times;</button>
    <div class="modal-title">Vista previa</div>
    <p class="hint">Así se verá para todos una vez que publiques los cambios. Todavía no se ha guardado nada.</p>
    ${previewHTML}
  `);
  document.getElementById("modalCloseBtn").addEventListener("click", closeModal);
});

document.getElementById("publishBtn").addEventListener("click", async () => {
  if (!currentMonthId){ alert("No hay un mes seleccionado."); return; }
  const cleanDates = draftDates.filter(d => d.dayLabel.trim() !== "");
  await setDoc(doc(db, "privilegios", currentMonthId), {
    monthLabel: currentMonthData.monthLabel,
    dates: cleanDates,
    updatedAt: new Date().toISOString(),
    updatedBy: currentUser ? currentUser.email : null,
  });
  await loadMonths();
  exitEditMode();
});

/* =========================================================================
   NUEVO MES
   ========================================================================= */
addMonthBtn.addEventListener("click", () => {
  openModal(`
    <button class="modal-close" id="modalCloseBtn">&times;</button>
    <div class="modal-title">Agregar nuevo mes</div>
    <p class="hint">Escribe el nombre del mes tal como quieres que se vea (ej: "Octubre 2026").</p>
    <div class="edit-date-head" style="margin-bottom:18px;">
      <input type="text" id="newMonthLabel" placeholder="Ej: Octubre 2026">
    </div>
    <div class="edit-actions">
      <button class="btn btn-primary" id="createMonthBtn">Crear mes</button>
      <button class="btn btn-ghost" id="modalCloseBtn2">Cancelar</button>
    </div>
  `);
  document.getElementById("modalCloseBtn").addEventListener("click", closeModal);
  document.getElementById("modalCloseBtn2").addEventListener("click", closeModal);
  document.getElementById("createMonthBtn").addEventListener("click", async () => {
    const label = document.getElementById("newMonthLabel").value.trim();
    if (!label){ return; }
    const id = label.toLowerCase()
      .normalize("NFD").replace(/[\u0300-\u036f]/g, "")
      .replace(/[^a-z0-9]+/g, "-").replace(/(^-|-$)/g, "");
    await setDoc(doc(db, "privilegios", id), {
      monthLabel: label,
      dates: [],
      updatedAt: new Date().toISOString(),
      updatedBy: currentUser ? currentUser.email : null,
    });
    closeModal();
    currentMonthId = id;
    await loadMonths();
    enterEditMode();
  });
});

/* =========================================================================
   ALERTAS DE PRIVILEGIOS (mensajes personalizados)
   ========================================================================= */
alertsBtn.addEventListener("click", () => {
  if (!currentMonthData || !currentMonthData.dates || currentMonthData.dates.length === 0){
    openModal(`
      <button class="modal-close" id="modalCloseBtn">&times;</button>
      <div class="modal-title">Enviar alertas</div>
      <p class="hint">Este mes todavía no tiene fechas publicadas.</p>
    `);
    document.getElementById("modalCloseBtn").addEventListener("click", closeModal);
    return;
  }

  // Agrupar asignaciones por persona
  const byPerson = {};
  currentMonthData.dates.forEach(d => {
    ROLES.forEach(r => {
      const name = d.roles[r.key];
      if (!name) return;
      if (!byPerson[name]) byPerson[name] = [];
      byPerson[name].push({ dayLabel: d.dayLabel, role: r.label.toUpperCase() });
    });
  });
  const people = Object.keys(byPerson).sort((a,b) => a.localeCompare(b, "es"));

  openModal(`
    <button class="modal-close" id="modalCloseBtn">&times;</button>
    <div class="modal-title">ALERTA DE PRIVILEGIOS</div>
    <p class="hint">Plantilla del mensaje (usa {nombre} y {lista} — se reemplazan automáticamente para cada persona).</p>
    <textarea class="template-box" id="templateBox">${DEFAULT_TEMPLATE}</textarea>
    <div id="peopleList"></div>
  `);
  document.getElementById("modalCloseBtn").addEventListener("click", closeModal);

  const templateBox = document.getElementById("templateBox");
  const peopleList = document.getElementById("peopleList");

  function buildMessage(name){
    const lista = byPerson[name].map(a => `${a.dayLabel}\n${a.role}`).join("\n\n");
    return templateBox.value.replace(/{nombre}/g, name).replace(/{lista}/g, lista);
  }

  function renderPeople(){
    peopleList.innerHTML = people.map(name => `
      <div class="msg-person">
        <div class="msg-person-name">${name}</div>
        <textarea class="msg-textarea" data-name="${name}" readonly>${buildMessage(name)}</textarea>
        <div class="msg-actions">
          <button class="btn copy-btn" data-name="${name}">Copiar</button>
          <button class="btn whatsapp-btn" data-name="${name}">WhatsApp</button>
          <button class="btn email-btn" data-name="${name}">Correo</button>
        </div>
      </div>
    `).join("");

    peopleList.querySelectorAll(".copy-btn").forEach(b => b.addEventListener("click", () => {
      navigator.clipboard.writeText(buildMessage(b.dataset.name));
      b.textContent = "¡Copiado!";
      setTimeout(() => b.textContent = "Copiar", 1500);
    }));
    peopleList.querySelectorAll(".whatsapp-btn").forEach(b => b.addEventListener("click", () => {
      const text = encodeURIComponent("*ALERTA DE PRIVILEGIOS*\n\n" + buildMessage(b.dataset.name));
      window.open(`https://api.whatsapp.com/send?text=${text}`, "_blank");
    }));
    peopleList.querySelectorAll(".email-btn").forEach(b => b.addEventListener("click", () => {
      const subject = encodeURIComponent("ALERTA DE PRIVILEGIOS");
      const body = encodeURIComponent(buildMessage(b.dataset.name));
      window.location.href = `mailto:?subject=${subject}&body=${body}`;
    }));
  }

  templateBox.addEventListener("input", renderPeople);
  renderPeople();
});
</script>
