<link rel="icon" type="image/png" sizes="32x32" href="assets/icons/favicon-32.png">
<link rel="icon" type="image/png" sizes="16x16" href="assets/icons/favicon-16.png">
<link rel="apple-touch-icon" href="assets/icons/apple-touch-icon.png">

<title>Editor · Reunión Pública</title>
<meta name="apple-mobile-web-app-title" content="Reunión Pública">
<meta name="application-name" content="Reunión Pública">
<meta name="apple-mobile-web-app-capable" content="yes">
<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
  import { getAuth, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
  import { firebaseConfig } from "./assets/js/firebase-config.js";
  import { isAllowed } from "./assets/js/allowlist.js";
  import { isEditor } from "./assets/js/editors.js";

  const app = initializeApp(firebaseConfig);
  const auth = getAuth(app);

  onAuthStateChanged(auth, async (user) => {
    if (!user){
      location.replace("login.html?redirect=reunion-publica-editor.html");
      return;
    }
    const allowed = await isAllowed(app, user);
    if (!allowed){
      const deniedEmail = user.email || "";
      await signOut(auth);
      location.replace(`login.html?denied=1&email=${encodeURIComponent(deniedEmail)}`);
      return;
    }
    const editor = await isEditor(app, user, "reunionpublica");
    if (!editor){
      // esta persona puede entrar al sitio, pero no está autorizada a editar
      // este programa en particular: la mandamos a la vista pública en vez
      // de mostrarle el editor completo.
      location.replace("reunion-publica.html");
      return;
    }
    document.documentElement.classList.remove("auth-pending");
    window.__phUser = user;
    const slot = document.getElementById("authSlot");
    if (slot){
      slot.innerHTML = `<button class="ph-logout" id="phLogoutBtn" type="button">Cerrar sesión</button>`;
      document.getElementById("phLogoutBtn").addEventListener("click", () => signOut(auth));
    }
  });
</script>

<body>

function lookupByNumber(map, numeroStr){
  const n = parseInt(numeroStr, 10);
  if(!numeroStr || isNaN(n)) return {text:"—", found:true};
  if(map[n]) return {text:map[n], found:true};
  return {text:"No encontrado", found:false};
}

function escapeHtml(str){
  return String(str == null ? "" : str).replace(/[&<>"']/g, c=>({
    "&":"&amp;", "<":"&lt;", ">":"&gt;", '"':"&quot;", "'":"&#39;"
  }[c]));
}

const DIAS_SEMANA = ["DOMINGO","LUNES","MARTES","MIÉRCOLES","JUEVES","VIERNES","SÁBADO"];
function formatDate(iso){
  if(!iso) return "";
  const parts = iso.split("-");
  if(parts.length !== 3) return iso;
  const [y,m,d] = parts;
  const dateObj = new Date(Number(y), Number(m)-1, Number(d));
  const diaNombre = DIAS_SEMANA[dateObj.getDay()];
  return `${diaNombre} ${d}/${m}/${y}`;
}

/* ================= AUTOCOMPLETADO (guardado en el navegador) ================= */
/* Campos con memoria de nombres: presidente, congregación, orador saliente,
   congregación visitada, conductor Atalaya y lector. Se guarda en localStorage
   cuando está disponible; si el navegador la bloquea (p. ej. vista previa en un
   entorno restringido), se usa memoria temporal solo para esta sesión. */
const AUTOCOMPLETE_STORAGE_KEY = "programaReunionPublica_autocompletado_v1";
const AUTOCOMPLETE_FIELDS = ["presidente", "congregacion", "oradorSaliente", "congregacionVisitada", "conductorAtalaya", "lector"];
let autocompleteStorageAvailable = true;

function loadAutocompleteData(){
  try{
    const raw = window.localStorage.getItem(AUTOCOMPLETE_STORAGE_KEY);
    const parsed = raw ? JSON.parse(raw) : {};
    const data = {};
    AUTOCOMPLETE_FIELDS.forEach(k=>{ data[k] = Array.isArray(parsed[k]) ? parsed[k] : []; });
    return data;
  }catch(err){
    autocompleteStorageAvailable = false;
    const data = {};
    AUTOCOMPLETE_FIELDS.forEach(k=>{ data[k] = []; });
    return data;
  }
}

let autocompleteData = loadAutocompleteData();

function saveAutocompleteData(){
  if(!autocompleteStorageAvailable) return;
  try{
    window.localStorage.setItem(AUTOCOMPLETE_STORAGE_KEY, JSON.stringify(autocompleteData));
  }catch(err){
    autocompleteStorageAvailable = false;
  }
}

function updateDatalistOptions(key){
  const dl = document.getElementById("dl-" + key);
  if(!dl) return;
  dl.innerHTML = "";
  (autocompleteData[key] || []).forEach(v=>{
    const opt = document.createElement("option");
    opt.value = v;
    dl.appendChild(opt);
  });
}

function addToAutocomplete(key, value){
  const v = (value || "").trim();
  if(!v || !AUTOCOMPLETE_FIELDS.includes(key)) return;
  const arr = autocompleteData[key] || (autocompleteData[key] = []);
  const yaExiste = arr.some(existing => existing.toLowerCase() === v.toLowerCase());
  if(!yaExiste){
    arr.push(v);
    arr.sort((a,b)=> a.localeCompare(b, "es"));
    if(arr.length > 60) arr.shift();
    saveAutocompleteData();
    updateDatalistOptions(key);
  }
}

function buildAutocompleteDatalists(){
  const container = document.createElement("div");
  container.style.display = "none";
  AUTOCOMPLETE_FIELDS.forEach(key=>{
    const dl = document.createElement("datalist");
    dl.id = "dl-" + key;
    container.appendChild(dl);
  });
  document.body.appendChild(container);
  AUTOCOMPLETE_FIELDS.forEach(updateDatalistOptions);
}


const MAX_WEEKS = 5;
let nextWeekId = 1;
let nextExtraId = 1;

function defaultWeekData(){
  return {
    fecha:"", presidente:"", cancionInicial:"", cancionInicialManual:"", oradorVisitante:"", congregacion:"",
    discursoNumero:"", discursoManual:"",
    hospitalidad:[false,false,false,false,false,false,false,false], // 0-5: Grupo 1-6, 6: "Todos", 7: "No aplica"
    section2Visible:true, fechaSalida:"", oradorSaliente:"", congregacionVisitada:"",
    cancionAtalaya:"", cancionAtalayaManual:"", conductorAtalaya:"",
    lectorVisible:true, lectorAtalaya:"",
    cancionFinalVisible:true, cancionFinal:"", cancionFinalManual:"",
    extraBlocks:[] // {id, titulo, orador, numero, numeroManual, cancionFinal, cancionFinalManual}
  };
}

function makeWeek(){
  return Object.assign({id: nextWeekId++}, defaultWeekData());
}

function normalizeExtraBlock(raw){
  const base = {titulo:"Discurso Final", orador:"", numero:"", numeroManual:"", cancionFinal:"", cancionFinalManual:""};
  const block = Object.assign({}, base, raw || {});
  block.id = (raw && typeof raw.id === "number") ? raw.id : (nextExtraId++);
  if(!block.titulo) block.titulo = "Discurso Final";
  return block;
}

function normalizeWeek(raw){
  const week = Object.assign({}, defaultWeekData(), raw || {});
  week.id = (raw && typeof raw.id === "number") ? raw.id : (nextWeekId++);
  if(!Array.isArray(week.hospitalidad)){
    week.hospitalidad = [false,false,false,false,false,false,false,false];
  } else {
    const arr = week.hospitalidad.map(Boolean);
    while(arr.length < 8) arr.push(false);
    week.hospitalidad = arr.slice(0,8);
  }
  week.extraBlocks = Array.isArray(week.extraBlocks) ? week.extraBlocks.map(normalizeExtraBlock) : [];
  return week;
}

function recalcIdCounters(){
  let maxWeek = 0, maxExtra = 0;
  state.weeks.forEach(w=>{
    if(typeof w.id === "number" && w.id > maxWeek) maxWeek = w.id;
    w.extraBlocks.forEach(b=>{
      if(typeof b.id === "number" && b.id > maxExtra) maxExtra = b.id;
    });
  });
  nextWeekId = maxWeek + 1;
  nextExtraId = maxExtra + 1;
}

/* ================= GUARDADO AUTOMÁTICO EN EL NAVEGADOR ================= */
const APP_STATE_STORAGE_KEY = "programaReunionPublica_estadoApp_v1";
let appAutosaveAvailable = true;
let appAutosaveTimer = null;

function loadSavedAppState(){
  try{
    const raw = window.localStorage.getItem(APP_STATE_STORAGE_KEY);
    if(!raw) return null;
    const parsed = JSON.parse(raw);
    if(!parsed || !Array.isArray(parsed.weeks) || parsed.weeks.length === 0) return null;
    return parsed;
  }catch(err){
    appAutosaveAvailable = false;
    return null;
  }
}

function saveAppStateNow(){
  if(!appAutosaveAvailable) return;
  try{
    window.localStorage.setItem(APP_STATE_STORAGE_KEY, JSON.stringify(state));
  }catch(err){
    appAutosaveAvailable = false;
  }
}

function scheduleAutosave(){
  if(!appAutosaveAvailable) return;
  clearTimeout(appAutosaveTimer);
  appAutosaveTimer = setTimeout(saveAppStateNow, 400);
}

const savedAppState = loadSavedAppState();
let state;
if(savedAppState){
  state = {
    weeks: savedAppState.weeks.slice(0, MAX_WEEKS).map(normalizeWeek),
    theme: (savedAppState.theme === "dark") ? "dark" : "light",
    appTitle: (typeof savedAppState.appTitle === "string" && savedAppState.appTitle.trim()) ? savedAppState.appTitle.trim() : "PAUL HARRIS"
  };
  recalcIdCounters();
} else {
  state = {
    weeks:[ makeWeek() ],
    theme:"light",
    appTitle:"PAUL HARRIS"
  };
}

const undoStack = [];
const redoStack = [];
const MAX_HISTORY = 5;

function cloneState(s){ return JSON.parse(JSON.stringify(s)); }

function pushHistory(){
  undoStack.push(cloneState(state));
  if(undoStack.length > MAX_HISTORY) undoStack.shift();
  redoStack.length = 0;
  updateHistoryButtons();
}

function updateHistoryButtons(){
  document.getElementById("undoBtn").disabled = undoStack.length === 0;
  document.getElementById("redoBtn").disabled = redoStack.length === 0;
}

function undo(){
  if(undoStack.length === 0) return;
  redoStack.push(cloneState(state));
  if(redoStack.length > MAX_HISTORY) redoStack.shift();
  state = undoStack.pop();
  render();
}

function redo(){
  if(redoStack.length === 0) return;
  undoStack.push(cloneState(state));
  if(undoStack.length > MAX_HISTORY) undoStack.shift();
  state = redoStack.pop();
  render();
}

/* ================= CONSTRUCTORES DE CAMPOS ================= */
function makeTextField(labelText, value, onInput, placeholder, extraClass, historyKey){
  const label = document.createElement("label");
  if(extraClass) label.className = extraClass;
  label.appendChild(document.createTextNode(labelText));
  const input = document.createElement("input");
  input.type = "text";
  input.value = value || "";
  if(placeholder) input.placeholder = placeholder;
  if(historyKey){
    input.setAttribute("list", "dl-" + historyKey);
    input.setAttribute("autocomplete", "on");
  }
  input.addEventListener("focus", ()=> pushHistory());
  input.addEventListener("input", ()=>{ onInput(input.value); scheduleAutosave(); });
  if(historyKey){
    input.addEventListener("blur", ()=> addToAutocomplete(historyKey, input.value));
  }
  label.appendChild(input);
  return {label, input};
}

function makeDateField(labelText, value, onInput){
  const label = document.createElement("label");
  label.className = "fecha-inline";
  label.appendChild(document.createTextNode(labelText));
  const input = document.createElement("input");
  input.type = "date";

}

function makeNumberLookupField(labelText, value, map, onInput, opts){
  opts = opts || {};
  const label = document.createElement("label");
  const classes = [];
  if(opts.extraClass) classes.push(opts.extraClass);
  if(opts.spanFull !== false) classes.push("titulo-field");
  label.className = classes.join(" ");
  label.appendChild(document.createTextNode(labelText));
  const row = document.createElement("div");
  row.className = "titulo-row";
  const input = document.createElement("input");
  input.type = "text";
  input.inputMode = "numeric";
  input.maxLength = 3;
  input.className = "numero-input";
  input.placeholder = "N.º";
  input.value = value || "";
  const displayWrap = document.createElement("div");
  displayWrap.className = "titulo-display-wrap";
  function refreshDisplay(){
    displayWrap.innerHTML = "";
    if(input.value.trim() === "0" && opts.manualGetter){
      const manualInput = document.createElement("input");
      manualInput.type = "text";
      manualInput.className = "titulo-display-manual";
      manualInput.placeholder = "Escribe el título manualmente";
      manualInput.value = opts.manualGetter() || "";
      manualInput.addEventListener("focus", ()=> pushHistory());
      manualInput.addEventListener("input", ()=>{ if(opts.manualSetter) opts.manualSetter(manualInput.value); scheduleAutosave(); });
      displayWrap.appendChild(manualInput);
    } else {
      const div = document.createElement("div");
      const r = lookupByNumber(map, input.value);
      div.textContent = r.text;
      div.className = "titulo-display" + (r.found ? "" : " not-found");
      displayWrap.appendChild(div);
    }
  }
  refreshDisplay();
  input.addEventListener("focus", ()=> pushHistory());
  input.addEventListener("input", ()=>{
    onInput(input.value);
    refreshDisplay();
    scheduleAutosave();
  });
  row.appendChild(input);
  row.appendChild(displayWrap);
  label.appendChild(row);
  return {label, input};
}

function makeInfoLine(pairs){
  // pairs: array de [etiqueta, valor] -> se muestran en una sola línea separados por " · "
  const line = document.createElement("div");
  line.className = "print-info-line";
  const parts = pairs
    .filter(p => p[1] !== undefined && p[1] !== null && p[1] !== "")
    .map(p => `<span class="print-info-label">${escapeHtml(p[0])}:</span> ${escapeHtml(p[1])}`);
  if(parts.length === 0) return null;
  line.innerHTML = parts.join(" &nbsp;·&nbsp; ");
  return line;
}

function resolveDiscursoDisplay(numeroStr, manualStr){
  const n = (numeroStr || "").trim();
  if(n === "0"){
    return (manualStr && manualStr.trim()) ? manualStr.trim() : "(sin título)";
  }
  if(!n) return "—";
  const r = lookupByNumber(DISCURSOS, n);
  if(r.found) return n + ". " + r.text;
  return r.text;
}

/* Igual que resolveDiscursoDisplay, pero devuelve número y título por
   separado — se usa solo para publicar en el sitio, en la impresión no
   hace falta. */
function resolveCancionParts(numeroStr, manualStr){
  const n = (numeroStr || "").trim();
  if(!n) return null;
  const r = lookupByNumber(SONGS, n);
  const titulo = r.found ? r.text : (manualStr && manualStr.trim() ? manualStr.trim() : r.text);
  return { numero: n, titulo };
}

function nombreGrupoHospitalidad(idx){
  if(idx < 6) return "Grupo " + (idx+1);
  if(idx === 6) return "Todos";
  return "No aplica";
}

function collectEmptyFieldsWarnings(){
  const issues = [];
  state.weeks.forEach((week, idx)=>{
    const faltantes = [];
    if(!week.fecha) faltantes.push("Fecha");
    if(!week.presidente) faltantes.push("Presidente");
    const numeroDiscurso = (week.discursoNumero || "").trim();
    const tituloVacio = (numeroDiscurso === "0") ? !(week.discursoManual || "").trim() : !numeroDiscurso;
    if(tituloVacio) faltantes.push("Título del discurso");
    if(!week.oradorVisitante) faltantes.push("Orador visitante");
    if(!week.congregacion) faltantes.push("Congregación");
    if(!week.conductorAtalaya) faltantes.push("Conductor (Atalaya)");
    if(faltantes.length){
      const etiquetaFecha = week.fecha ? (" (" + formatDate(week.fecha) + ")") : "";
      issues.push("Programa " + (idx+1) + etiquetaFecha + ": falta " + faltantes.join(", "));
    }
  });
  return issues;
}

function renderPrintSummary(){
  const el = document.getElementById("printSummary");
  el.innerHTML = "";

  const frame = document.createElement("div");
  frame.className = "print-frame";

  const title = document.createElement("div");
  title.className = "print-frame-title";
  title.textContent = "PROGRAMA REUNIÓN PÚBLICA " + (state.appTitle || "PAUL HARRIS");
  frame.appendChild(title);

  state.weeks.forEach((week, i)=>{
    const row = document.createElement("div");
    row.className = "print-row";

    const linea1 = document.createElement("div");
    linea1.className = "print-line1";
    const fechaSpan = document.createElement("span");
    fechaSpan.className = "print-fecha-val";
    fechaSpan.textContent = week.fecha ? formatDate(week.fecha) : "(sin fecha)";
    linea1.appendChild(fechaSpan);
    const gruposActivos = week.hospitalidad
      .map((activo, idx2)=> activo ? nombreGrupoHospitalidad(idx2) : null)
      .filter(Boolean)
      .join(", ");
    if(gruposActivos){
      const hospSpan = document.createElement("span");
      hospSpan.className = "print-hosp-val";
      hospSpan.innerHTML = `<span class="print-info-label">Hospitalidad:</span> ${escapeHtml(gruposActivos)}`;
      linea1.appendChild(hospSpan);
    }
    row.appendChild(linea1);

    const tituloTexto = resolveDiscursoDisplay(week.discursoNumero, week.discursoManual);
    const linea2 = document.createElement("div");
    linea2.className = "print-line2";
    const items2 = [];
    if(week.presidente){
      items2.push(`<span><span class="print-info-label">Presidente:</span> ${escapeHtml(week.presidente)}</span>`);
    }
    items2.push(`<span class="print-titulo-item"><span class="print-info-label">Título del discurso:</span> ${escapeHtml(tituloTexto)}</span>`);
    if(week.oradorVisitante){
      items2.push(`<span><span class="print-info-label">Orador:</span> ${escapeHtml(week.oradorVisitante)}</span>`);
    }
    if(week.congregacion){
      items2.push(`<span><span class="print-info-label">Congregación:</span> ${escapeHtml(week.congregacion)}</span>`);
    }
    linea2.innerHTML = items2.join("");
    row.appendChild(linea2);

    if(week.section2Visible && (week.oradorSaliente || week.congregacionVisitada || week.fechaSalida)){
      const salidaTitle = document.createElement("div");
      salidaTitle.className = "print-subhead";
      salidaTitle.textContent = "Orador local que sale";
      row.appendChild(salidaTitle);
      const lineaSalida = makeInfoLine([
        ["Fecha", week.fechaSalida ? formatDate(week.fechaSalida) : ""],
        ["Orador", week.oradorSaliente],
        ["Congregación visitada", week.congregacionVisitada],
      ]);
      if(lineaSalida) row.appendChild(lineaSalida);
    }

    const atalayaTitle = document.createElement("div");
    atalayaTitle.className = "print-subhead";
    atalayaTitle.textContent = "Estudio de la Atalaya";
    row.appendChild(atalayaTitle);

    const lineaAtalaya = makeInfoLine([
      ["Conductor", week.conductorAtalaya],
      ["Lector", week.lectorVisible ? week.lectorAtalaya : ""],
    ]);
    if(lineaAtalaya) row.appendChild(lineaAtalaya);

    week.extraBlocks.forEach(block=>{
      const extraTitle = document.createElement("div");
      extraTitle.className = "print-subhead";
      extraTitle.textContent = block.titulo || "Discurso Final";
      row.appendChild(extraTitle);

      const tituloExtraTexto = resolveDiscursoDisplay(block.numero, block.numeroManual);
      const lineaExtra1 = makeInfoLine([
        ["Orador", block.orador],
        ["Título discurso", (block.numero || block.numeroManual) ? tituloExtraTexto : ""],
      ]);
      if(lineaExtra1) row.appendChild(lineaExtra1);
    });

    frame.appendChild(row);

    if(i < state.weeks.length - 1){
      const sep = document.createElement("div");
      sep.className = "print-separator";
      const pill1 = document.createElement("span");
      pill1.className = "sep-pill";
      const pill2 = document.createElement("span");
      pill2.className = "sep-pill";
      sep.appendChild(pill1);
      sep.appendChild(pill2);
      frame.appendChild(sep);
    }
  });

  el.appendChild(frame);
}

/* ================= RENDER PRINCIPAL ================= */
function render(){
  const container = document.getElementById("weeksContainer");
  container.innerHTML = "";
  state.weeks.forEach((week, idx)=>{
    container.appendChild(buildWeekEl(week, idx));
  });

  document.body.setAttribute("data-theme", state.theme);
  document.getElementById("themeBtn").textContent = state.theme === "dark" ? "☀️ Claro" : "🌙 Oscuro";

  const appTitleEl = document.getElementById("appTitleEditable");
  if(appTitleEl && document.activeElement !== appTitleEl){
    appTitleEl.textContent = state.appTitle;
  }

  renderPrintSummary();
  updateHistoryButtons();
  scheduleAutosave();
}

/* ================= TEMA / DESHACER / REHACER / IMPRIMIR ================= */
document.getElementById("themeBtn").addEventListener("click", ()=>{
  pushHistory();
  state.theme = state.theme === "dark" ? "light" : "dark";
  render();
});
document.getElementById("undoBtn").addEventListener("click", undo);
document.getElementById("redoBtn").addEventListener("click", redo);
document.getElementById("printBtn").addEventListener("click", ()=>{
  renderPrintSummary();
  const avisos = collectEmptyFieldsWarnings();
  if(avisos.length){
    alert("Aviso: hay campos vacíos antes de imprimir.\n\n" + avisos.join("\n") + "\n\nPuedes imprimir igual; esto es solo informativo.");
  }
  window.print();
});
window.addEventListener("beforeprint", renderPrintSummary);

document.getElementById("clearAllBtn").addEventListener("click", ()=>{
  const ok = confirm("¿Vaciar todo y empezar un programa nuevo desde cero? Podrás usar \"Deshacer\" si te arrepientes.");
  if(!ok) return;
  pushHistory();
  state.weeks = [ makeWeek() ];
  render();
});

/* ================= NOMBRE EDITABLE DEL TÍTULO ================= */
const appTitleEl = document.getElementById("appTitleEditable");
appTitleEl.textContent = state.appTitle;
appTitleEl.addEventListener("focus", ()=> pushHistory());
appTitleEl.addEventListener("blur", ()=>{
  const nuevo = appTitleEl.textContent.trim() || "PAUL HARRIS";
  state.appTitle = nuevo;
  appTitleEl.textContent = nuevo;
  renderPrintSummary();
  scheduleAutosave();
});
appTitleEl.addEventListener("keydown", (e)=>{
  if(e.key === "Enter"){ e.preventDefault(); appTitleEl.blur(); }
});

/* ================= EXPORTAR / IMPORTAR (.json) ================= */
document.getElementById("exportBtn").addEventListener("click", ()=>{
  const dataStr = JSON.stringify(state, null, 2);
  const blob = new Blob([dataStr], {type:"application/json"});
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url;
  const stamp = new Date().toISOString().slice(0,10);
  a.download = "programa_reunion_publica_" + stamp + ".json";
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  // se retrasa la revocación para evitar que algunos navegadores corten
  // la descarga antes de que termine de generarse el archivo
  setTimeout(()=> URL.revokeObjectURL(url), 2000);
});

document.getElementById("importBtn").addEventListener("click", ()=>{
  document.getElementById("importFileInput").click();
});

document.getElementById("importFileInput").addEventListener("change", (e)=>{
  const file = e.target.files && e.target.files[0];
  if(!file) return;
  const reader = new FileReader();
  reader.onload = ()=>{
    try{
      // se quita un posible BOM al inicio del archivo (algunos editores lo agregan)
      let rawText = String(reader.result || "").replace(/^\uFEFF/, "").trim();
      let parsed = JSON.parse(rawText);

      // formatos alternativos: array de semanas directo, o el estado anidado bajo "state"
      if(Array.isArray(parsed)){
        parsed = { weeks: parsed };
      } else if(parsed && !Array.isArray(parsed.weeks) && parsed.state && Array.isArray(parsed.state.weeks)){
        parsed = parsed.state;
      }

      if(!parsed || !Array.isArray(parsed.weeks) || parsed.weeks.length === 0){
        const foundKeys = (parsed && typeof parsed === "object") ? Object.keys(parsed).join(", ") : "(ninguna)";
        alert("El archivo no tiene un formato válido de programa (falta la lista de semanas).\nClaves encontradas en el archivo: " + foundKeys);
        return;
      }
      pushHistory();
      const weeks = parsed.weeks.slice(0, MAX_WEEKS).map(normalizeWeek);
      state = {
        weeks: weeks,
        theme: (parsed.theme === "dark") ? "dark" : "light",
        appTitle: (typeof parsed.appTitle === "string" && parsed.appTitle.trim()) ? parsed.appTitle.trim() : "PAUL HARRIS"
      };
      recalcIdCounters();
      render();
    }catch(err){
      alert("No se pudo leer el archivo como JSON válido. Detalle: " + err.message);
    }
  };
  reader.onerror = ()=>{
    alert("Ocurrió un error al leer el archivo.");
  };
  reader.readAsText(file, "UTF-8");
  e.target.value = "";
});

/* ================= INICIO ================= */
buildAutocompleteDatalists();
render();
</script>

<script>
/* =========================================================================
   Datos "resueltos" para el sitio — igual a lo que se imprime en papel,
   más número/título de canciones (que en el papel no se muestran, pero en
   el sitio sí). La usan tanto "Vista previa" como "Publicar".
   ========================================================================= */
function buildResolvedWeeks(){
  return state.weeks.map(week => {
    const hospActivo = week.hospitalidad.findIndex(Boolean);
    return {
      fechaDisplay: week.fecha ? formatDate(week.fecha) : "",
      hospitalidad: hospActivo >= 0 ? nombreGrupoHospitalidad(hospActivo) : "",
      cancionInicial: resolveCancionParts(week.cancionInicial, week.cancionInicialManual),
      presidente: week.presidente || "",
      tituloDiscurso: resolveDiscursoDisplay(week.discursoNumero, week.discursoManual),
      oradorVisitante: week.oradorVisitante || "",
      congregacion: week.congregacion || "",
      salida: (week.section2Visible && (week.oradorSaliente || week.congregacionVisitada || week.fechaSalida)) ? {
        fechaDisplay: week.fechaSalida ? formatDate(week.fechaSalida) : "",
        orador: week.oradorSaliente || "",
        congregacionVisitada: week.congregacionVisitada || "",
      } : null,
      cancionAtalaya: resolveCancionParts(week.cancionAtalaya, week.cancionAtalayaManual),
      atalaya: {
        conductor: week.conductorAtalaya || "",
        lector: week.lectorVisible ? (week.lectorAtalaya || "") : "",
      },
      cancionFinal: week.cancionFinalVisible ? resolveCancionParts(week.cancionFinal, week.cancionFinalManual) : null,
      extraBlocks: (week.extraBlocks || []).map(b => ({
        titulo: b.titulo || "Discurso Final",
        orador: b.orador || "",
        tituloDiscurso: (b.numero || b.numeroManual) ? resolveDiscursoDisplay(b.numero, b.numeroManual) : "",
        cancion: resolveCancionParts(b.cancionFinal, b.cancionFinalManual),
      })),
    };
  });
}

/* =========================================================================
   VISTA PREVIA — muestra cómo se va a ver en el sitio, sin publicar nada.
   ========================================================================= */
function esc(s){
  return (s || "").replace(/[&<>"']/g, m => ({ "&":"&amp;", "<":"&lt;", ">":"&gt;", '"':"&quot;", "'":"&#39;" }[m]));
}
function cancionLinea(c){
  if(!c) return "";
  return `${esc(c.numero)}. ${esc(c.titulo)}`;
}
function previewWeekHTML(week){
  const salidaHTML = week.salida ? `
    <div class="pv-sub">
      <div class="pv-sub-title">Orador local que sale</div>
      <div class="pv-line">${[week.salida.fechaDisplay ? esc(week.salida.fechaDisplay) : "", esc(week.salida.orador) || "Sin asignar", esc(week.salida.congregacionVisitada) || "Sin asignar"].filter(Boolean).join(" &nbsp;·&nbsp; ")}</div>
    </div>` : "";
  const extraHTML = (week.extraBlocks || []).map(b => `
    <div class="pv-sub">
      <div class="pv-sub-title">${esc(b.titulo)}</div>
      <div class="pv-line">${[esc(b.orador) || "Sin asignar", b.tituloDiscurso ? esc(b.tituloDiscurso) : ""].filter(Boolean).join(" &nbsp;·&nbsp; ")}</div>
      ${b.cancion ? `<div class="pv-line pv-song">🎵 ${cancionLinea(b.cancion)}</div>` : ""}
    </div>`).join("");

  return `
    <div class="pv-week">
      <div class="pv-date">${esc(week.fechaDisplay) || "Sin fecha"}</div>
      ${week.hospitalidad ? `<div class="pv-line"><b>Hospitalidad:</b> ${esc(week.hospitalidad)}</div>` : ""}
      ${week.cancionInicial ? `<div class="pv-line pv-song">🎵 ${cancionLinea(week.cancionInicial)}</div>` : ""}
      <div class="pv-line">${[esc(week.presidente) || "Sin asignar (Presidente)"].join("")}</div>
      <div class="pv-line"><b>${esc(week.tituloDiscurso) || "Sin asignar"}</b></div>
      <div class="pv-line">${[esc(week.oradorVisitante) || "Sin asignar", esc(week.congregacion) || "Sin asignar"].filter(Boolean).join(" &nbsp;·&nbsp; ")}</div>
      ${salidaHTML}
      <div class="pv-sub">
        <div class="pv-sub-title">Estudio de La Atalaya</div>
        ${week.cancionAtalaya ? `<div class="pv-line pv-song">🎵 ${cancionLinea(week.cancionAtalaya)}</div>` : ""}
        <div class="pv-line">${[esc(week.atalaya.conductor) || "Sin asignar", week.atalaya.lector ? esc(week.atalaya.lector) : ""].filter(Boolean).join(" &nbsp;·&nbsp; ")}</div>
      </div>
      ${week.cancionFinal ? `<div class="pv-line pv-song">🎵 Canción final: ${cancionLinea(week.cancionFinal)}</div>` : ""}
      ${extraHTML}
    </div>
  `;
}

const previewOverlay = document.createElement("div");
previewOverlay.className = "pv-overlay";
previewOverlay.innerHTML = `<div class="pv-box"><button class="pv-close" type="button">&times;</button><div class="pv-title">Vista previa</div><p class="pv-hint">Así se va a ver en el sitio para todos los miembros una vez que publiques. Todavía no se ha guardado nada.</p><div id="pvContent"></div></div>`;
document.body.appendChild(previewOverlay);
previewOverlay.querySelector(".pv-close").addEventListener("click", () => previewOverlay.classList.remove("show"));
previewOverlay.addEventListener("click", (e) => { if(e.target === previewOverlay) previewOverlay.classList.remove("show"); });

document.getElementById("previewBtn").addEventListener("click", () => {
  const weeks = buildResolvedWeeks();
  document.getElementById("pvContent").innerHTML = weeks.length
    ? weeks.map(previewWeekHTML).join("")
    : `<div class="pv-empty">No hay semanas cargadas todavía.</div>`;
  previewOverlay.classList.add("show");
});

/* =========================================================================
   PUBLICAR — toma el estado actual ya resuelto y lo guarda en Firestore
   para que todos los miembros lo vean en reunion-publica.html. No modifica
   nada de la lógica del editor.
   ========================================================================= */
document.getElementById("publishBtn").addEventListener("click", async () => {
  const btn = document.getElementById("publishBtn");
  const original = btn.textContent;
  btn.disabled = true;
  btn.textContent = "Publicando…";
  try{
    const { initializeApp, getApps, getApp } = await import("https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js");
    const { getFirestore, doc, setDoc } = await import("https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js");
    const { firebaseConfig } = await import("./assets/js/firebase-config.js");
    const app = getApps().length ? getApp() : initializeApp(firebaseConfig);
    const db = getFirestore(app);

    await setDoc(doc(db, "reunionpublica", "published"), {
      appTitle: state.appTitle,
      weeks: buildResolvedWeeks(),
      publishedAt: new Date().toISOString(),
      publishedBy: window.__phUser ? window.__phUser.email : null,
    });

    btn.textContent = "¡Publicado!";
    setTimeout(() => { btn.textContent = original; btn.disabled = false; }, 1800);
  } catch (err){
    console.error("No se pudo publicar:", err);
    alert("No se pudo publicar. Revisa tu conexión e inténtalo de nuevo.");
    btn.textContent = original;
    btn.disabled = false;
  }
});
</script>
