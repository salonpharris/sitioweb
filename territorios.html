<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="manifest" href="manifest.json">
<link rel="icon" type="image/png" sizes="32x32" href="assets/icons/favicon-32.png">
<link rel="icon" type="image/png" sizes="16x16" href="assets/icons/favicon-16.png">
<link rel="apple-touch-icon" href="assets/icons/apple-touch-icon.png">
<link rel="apple-touch-icon" sizes="152x152" href="assets/icons/apple-touch-icon-152.png">
<link rel="apple-touch-icon" sizes="167x167" href="assets/icons/apple-touch-icon-167.png">
<meta name="theme-color" content="#0a1030">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

<title>Territorios — Paul Harris</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,500;1,500;1,600&family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">

  pdfjsLib.GlobalWorkerOptions.workerSrc = "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js";

<style>

  /* =====================================================
     Mismos tokens visuales que el sitio madre (Sitio PH)
     ===================================================== */
  :root{
    --bg-0:#04050c;
    --bg-1:#0a1030;
    --bg-2:#161f5c;
    --bg-3:#2b3bb0;
    --bg-4:#3f4fe0;
    --glow:#6d86ff;
    --glow-soft:#7fa0ff;
    --ink:#f4f5fb;
    --ink-dim:#aeb6e0;
    --ink-faint:#7078a8;
    --line: rgba(255,255,255,0.10);
    --card: rgba(255,255,255,0.045);
    --card-hover: rgba(255,255,255,0.09);
    --radius: 14px;
    --serif: 'Playfair Display', serif;
    --sans: 'Outfit', sans-serif;
  }

  *{box-sizing:border-box; margin:0; padding:0;}
  html{scroll-behavior:smooth;}

  body{
    font-family:var(--sans);
    background:
      radial-gradient(ellipse 120% 60% at 50% -10%, #0e1650 0%, transparent 55%),
      linear-gradient(115deg, var(--bg-0) 0%, var(--bg-1) 28%, var(--bg-2) 55%, var(--bg-3) 78%, var(--bg-4) 100%);
    background-attachment: fixed;
    color:var(--ink);
    min-height:100vh;
    overflow-x:hidden;
    -webkit-font-smoothing:antialiased;
  }

  @media (prefers-reduced-motion: reduce){
    *{animation-duration:0.001ms !important; animation-iteration-count:1 !important; transition-duration:0.001ms !important;}
  }

  a{color:inherit; text-decoration:none;}
  button{font-family:inherit;}
  :focus-visible{ outline:2px solid var(--glow-soft); outline-offset:3px; border-radius:8px; }

  .wrap{ max-width:720px; margin:0 auto; padding:0 28px 80px; }
  @media (min-width:900px){ .wrap{ max-width:800px; padding:0 40px 90px; } }
  @media (min-width:1280px){ .wrap{ max-width:900px; } }

  /* BLOOM */
  .bloom{ position:relative; width:min(340px, 78vw); height:min(340px, 78vw); margin:0 auto; }
  .bloom::before, .bloom::after{ content:""; position:absolute; inset:0; border-radius:50%; filter:blur(40px); }
  .bloom::before{
    background:
      radial-gradient(circle at 30% 30%, rgba(125,150,255,0.5), transparent 60%),
      radial-gradient(circle at 68% 40%, rgba(95,115,240,0.45), transparent 58%),
      radial-gradient(circle at 50% 68%, rgba(70,90,210,0.4), transparent 60%);
    animation: breathe 9s ease-in-out infinite;
  }
  .bloom::after{
    background: radial-gradient(circle at 50% 50%, rgba(200,210,255,0.32), transparent 55%);
    animation: breathe 9s ease-in-out infinite reverse; animation-delay:-3s;
  }
  @keyframes breathe{ 0%,100%{ transform:scale(1); opacity:0.85; } 50%{ transform:scale(1.08); opacity:1; } }

  .topbar{ display:flex; align-items:center; justify-content:space-between; padding:26px 0 0; }
  .back-link{
    display:inline-flex; align-items:center; gap:8px;
    font-size:12.5px; letter-spacing:0.08em; text-transform:uppercase;
    color:var(--ink-faint); transition:color 0.25s ease;
  }
  .back-link:hover{ color:var(--ink-dim); }
  .back-link svg{ width:15px; height:15px; stroke:currentColor; fill:none; stroke-width:1.6; }

  .auth-slot{ display:flex; align-items:center; gap:12px; }
  .auth-user{ display:flex; flex-direction:column; align-items:flex-end; line-height:1.35; }
  .auth-name{ font-size:12.5px; color:var(--ink-dim); }
  .auth-email{ font-size:10.5px; color:var(--ink-faint); }
  .auth-logout{
    font-family:var(--sans);
    font-size:12px;
    letter-spacing:0.05em;
    color:var(--ink-dim);
    background:rgba(255,255,255,0.06);
    border:1px solid var(--line);
    border-radius:999px;
    padding:7px 14px;
    cursor:pointer;
    transition: background 0.25s ease, border-color 0.25s ease;
  }
  .auth-logout:hover, .auth-logout:focus-visible{ background:var(--card-hover); border-color:rgba(255,255,255,0.22); }

  .hero{ position:relative; padding:18px 0 22px; text-align:center; }
  .hero-inner{ position:absolute; inset:0; display:flex; align-items:center; justify-content:center; pointer-events:none; }
  .hero-text{ position:relative; z-index:2; }
  .eyebrow{ font-family:var(--serif); font-style:normal; font-weight:500; font-size:clamp(17px,4.2vw,21px); color:var(--ink-dim); display:block; }
  .title-main{
    font-family:var(--sans); font-weight:600; font-size:clamp(30px,7vw,44px);
    letter-spacing:-0.01em; margin-top:2px; display:block;
    background:linear-gradient(180deg, #ffffff 0%, #c9d3ff 100%);
    -webkit-background-clip:text; background-clip:text; color:transparent;
  }

  /* Botón mapa completo */
  .map-cta{
    display:flex; align-items:center; justify-content:space-between; gap:14px;
    margin-top:26px;
    padding:20px 22px;
    background:var(--card);
    border:1px solid var(--line);
    border-radius:var(--radius);
    backdrop-filter: blur(10px);
    cursor:pointer;
    transition: background 0.3s ease, transform 0.3s ease, border-color 0.3s ease;
  }
  .map-cta:hover, .map-cta:focus-visible{
    background:var(--card-hover); border-color:rgba(255,255,255,0.22); transform:translateY(-2px);
  }
  .map-cta-text{ text-align:left; }
  .map-cta-title{ font-size:15px; font-weight:600; color:var(--ink); }
  .map-cta-sub{ font-size:12px; color:var(--ink-faint); margin-top:3px; letter-spacing:0.03em; }
  .map-cta-icon{ width:30px; height:30px; stroke:var(--glow-soft); fill:none; stroke-width:1.5; flex-shrink:0; }

  .section-label{
    font-size:12px; letter-spacing:0.22em; text-transform:uppercase; color:var(--ink-faint);
    font-weight:500; margin:38px 0 16px; display:flex; align-items:center; gap:12px;
  }
  .section-label::after{ content:""; flex:1; height:1px; background:linear-gradient(90deg, var(--line), transparent); }

  /* Rangos */
  .range-grid{ display:grid; grid-template-columns:1fr 1fr; gap:14px; }
  .range-card{
    padding:24px 20px; background:var(--card); border:1px solid var(--line); border-radius:var(--radius);
    backdrop-filter: blur(10px); cursor:pointer; text-align:left;
    transition: background 0.3s ease, transform 0.3s ease, border-color 0.3s ease;
  }
  .range-card:hover, .range-card:focus-visible{
    background:var(--card-hover); border-color:rgba(255,255,255,0.22); transform:translateY(-3px);
  }
  .range-label{ font-family:var(--sans); font-weight:600; font-size:19px; color:var(--ink); }
  .range-sub{ font-size:11.5px; color:var(--ink-faint); margin-top:4px; letter-spacing:0.05em; }

  /* Grid de territorios dentro de un rango */
  .territory-grid{ display:grid; grid-template-columns:repeat(4, 1fr); gap:10px; }
  @media (max-width:420px){ .territory-grid{ grid-template-columns:repeat(3, 1fr); } }
  .territory-pill{
    padding:16px 6px; text-align:center; background:var(--card); border:1px solid var(--line);
    border-radius:var(--radius); font-size:15px; font-weight:600; color:var(--ink); cursor:pointer;
    transition: background 0.25s ease, transform 0.25s ease, border-color 0.25s ease;
  }
  .territory-pill:hover, .territory-pill:focus-visible{
    background:var(--card-hover); border-color:rgba(255,255,255,0.22); transform:translateY(-2px);
  }

  .back-btn{
    display:inline-flex; align-items:center; gap:8px; font-size:12.5px; letter-spacing:0.08em;
    text-transform:uppercase; color:var(--ink-faint); padding:10px 4px; cursor:pointer; transition:color 0.25s ease;
    margin-bottom:6px;
  }
  .back-btn:hover{ color:var(--ink-dim); }
  .back-btn svg{ width:15px; height:15px; stroke:currentColor; fill:none; stroke-width:1.6; }

  .view-title{
    font-family:var(--sans); font-weight:700; font-size:clamp(22px,5.2vw,28px); color:var(--ink);
    margin:14px 0 18px;
  }

  /* Visor de mapa (zoom / pan) */
  .map-viewer{
    position:relative;
    width:100%;
    height:min(72vh, 640px);
    background:rgba(255,255,255,0.03);
    border:1px solid var(--line);
    border-radius:var(--radius);
    overflow:hidden;
    touch-action:none;
    cursor:grab;
  }
  .map-viewer.dragging{ cursor:grabbing; }
  .zoom-layer{
    position:absolute; top:0; left:0;
    transform-origin:0 0;
    will-change:transform;
  }
  .zoom-layer img, .zoom-layer canvas{ display:block; max-width:none; user-select:none; -webkit-user-drag:none; }

  .viewer-hint{
    position:absolute; bottom:12px; left:50%; transform:translateX(-50%);
    font-size:11px; letter-spacing:0.05em; color:var(--ink-faint);
    background:rgba(4,5,12,0.55); padding:6px 12px; border-radius:999px;
    pointer-events:none; opacity:0.9;
  }

  .fullscreen-btn{
    position:absolute; top:12px; right:12px;
    width:38px; height:38px;
    display:flex; align-items:center; justify-content:center;
    background:rgba(4,5,12,0.55);
    border:1px solid var(--line);
    border-radius:10px;
    color:var(--ink);
    cursor:pointer;
    backdrop-filter:blur(6px);
    transition: background 0.25s ease, border-color 0.25s ease;
  }
  .fullscreen-btn:hover, .fullscreen-btn:focus-visible{
    background:rgba(4,5,12,0.75); border-color:rgba(255,255,255,0.25);
  }
  .fullscreen-btn svg{ width:18px; height:18px; stroke:currentColor; fill:none; stroke-width:1.8; }

  .map-viewer:fullscreen{
    height:100vh; width:100vw; border-radius:0; background:#000;
  }
  .map-viewer:-webkit-full-screen{
    height:100vh; width:100vw; border-radius:0; background:#000;
  }

  #view-general{ display:none; }
  #view-general.show{ display:block; }
  #view-territory{ display:none; }
  #view-territory.show{ display:block; }
  #view-range{ display:none; }
  #view-range.show{ display:block; }
  #view-home.hide{ display:none; }

  footer{ padding:60px 0 10px; text-align:center; }
  .footer-sub{ font-size:11.5px; letter-spacing:0.15em; text-transform:uppercase; color:var(--ink-faint); opacity:0.6; }
</style>
</head>
<body>

<main class="wrap">

  <div class="topbar">
    <a class="back-link" href="index.html">
      <svg viewBox="0 0 24 24"><path d="M11 4L5 10l6 6M5 10h14"/></svg>
      Plataforma PH
    </a>
    <div class="auth-slot" id="authSlot"></div>
  </div>

  <!-- ============ VISTA INICIAL ============ -->
  <div id="view-home">
    <header class="hero">
      <div class="hero-inner"><div class="bloom" aria-hidden="true"></div></div>
      <div class="hero-text">
        <span class="eyebrow">Sitio Paul Harris</span>
        <span class="title-main">Territorios</span>
      </div>
    </header>

    <div class="map-cta" id="openGeneral" tabindex="0" role="button">
      <div class="map-cta-text">
        <div class="map-cta-title">Mapa completo</div>
        <div class="map-cta-sub">Versión 6.0</div>
      </div>
      <svg class="map-cta-icon" viewBox="0 0 24 24"><path d="M9 4L3 6v14l6-2 6 2 6-2V4l-6 2-6-2z"/><path d="M9 4v14M15 6v14"/></svg>
    </div>

    <div class="section-label">Territorios Individuales</div>
    <div class="range-grid" id="rangeGrid"><!-- se llena con JS desde CONFIG --></div>
  </div>

  <!-- ============ VISTA DE RANGO ============ -->
  <div id="view-range">
    <div class="back-btn" id="backFromRange">
      <svg viewBox="0 0 24 24"><path d="M11 4L5 10l6 6M5 10h14"/></svg>
      Volver a Territorios
    </div>
    <div class="view-title" id="rangeTitle"></div>
    <div class="territory-grid" id="territoryGrid"><!-- se llena con JS --></div>
  </div>

  <!-- ============ VISTA DE TERRITORIO INDIVIDUAL ============ -->
  <div id="view-territory">
    <div class="back-btn" id="backFromTerritory">
      <svg viewBox="0 0 24 24"><path d="M11 4L5 10l6 6M5 10h14"/></svg>
      Volver al rango
    </div>
    <div class="view-title" id="territoryTitle"></div>
    <div class="map-viewer" id="territoryViewer">
      <div class="zoom-layer" id="territoryZoomLayer">
        <canvas id="territoryCanvas"></canvas>
      </div>
      <button class="fullscreen-btn" id="territoryFullscreenBtn" title="Pantalla completa" aria-label="Pantalla completa" type="button">
        <svg viewBox="0 0 24 24"><path d="M9 4H5a1 1 0 00-1 1v4M15 4h4a1 1 0 011 1v4M9 20H5a1 1 0 01-1-1v-4M15 20h4a1 1 0 001-1v-4"/></svg>
      </button>
      <div class="viewer-hint" id="territoryHint">Arrastra para mover · rueda o pellizca para acercar</div>
    </div>
  </div>

  <!-- ============ VISTA MAPA GENERAL ============ -->
  <div id="view-general">
    <div class="back-btn" id="backFromGeneral">
      <svg viewBox="0 0 24 24"><path d="M11 4L5 10l6 6M5 10h14"/></svg>
      Volver a Territorios
    </div>
    <div class="view-title">Mapa completo · v6.0</div>
    <div class="map-viewer" id="generalViewer">
      <div class="zoom-layer" id="generalZoomLayer">
        <canvas id="generalCanvas"></canvas>
      </div>
      <button class="fullscreen-btn" id="generalFullscreenBtn" title="Pantalla completa" aria-label="Pantalla completa" type="button">
        <svg viewBox="0 0 24 24"><path d="M9 4H5a1 1 0 00-1 1v4M15 4h4a1 1 0 011 1v4M9 20H5a1 1 0 01-1-1v-4M15 20h4a1 1 0 001-1v-4"/></svg>
      </button>
      <div class="viewer-hint" id="generalHint">Arrastra para mover · rueda o pellizca para acercar</div>
    </div>
  </div>

  <footer><div class="footer-sub">Plataforma PH</div></footer>

</main>

<script>
/* =========================================================================
   CONFIGURACIÓN — EDITA AQUÍ
   ========================================================================= */
const TOTAL_TERRITORIOS = 35;

const RANGES = [
  { key:"1-10",  label:"1 al 10",   from:1,  to:10 },
  { key:"11-20", label:"11 al 20",  from:11, to:20 },
  { key:"21-30", label:"21 al 30",  from:21, to:30 },
  { key:"31-35", label:"31 al 35",  from:31, to:35 },
];

/* PDF de cada territorio: assets/territorios/territorio-N.pdf */
function territoryPdfSrc(n){ return `assets/territorios/territorio-${n}.pdf`; }
const GENERAL_PDF_SRC = "assets/mapa-general.pdf";

/* =========================================================================
   RENDER — vista inicial: rangos
   ========================================================================= */
const rangeGrid = document.getElementById("rangeGrid");
rangeGrid.innerHTML = RANGES.map(r => `
  <div class="range-card" data-range="${r.key}" tabindex="0" role="button">
    <div class="range-label">${r.label}</div>
    <div class="range-sub">${r.to - r.from + 1} territorios</div>
  </div>
`).join("");

rangeGrid.querySelectorAll(".range-card").forEach(card => {
  card.addEventListener("click", () => openRange(card.dataset.range));
  card.addEventListener("keydown", e => { if (e.key==="Enter"||e.key===" "){ e.preventDefault(); openRange(card.dataset.range); } });
});

/* =========================================================================
   NAVEGACIÓN ENTRE VISTAS
   ========================================================================= */
const viewHome = document.getElementById("view-home");
const viewRange = document.getElementById("view-range");
const viewTerritory = document.getElementById("view-territory");
const viewGeneral = document.getElementById("view-general");

let currentRangeKey = null;

function showOnly(view){
  [viewRange, viewTerritory, viewGeneral].forEach(v => v.classList.remove("show"));
  if (view === "home"){ viewHome.classList.remove("hide"); }
  else{ viewHome.classList.add("hide"); view.classList.add("show"); }
  window.scrollTo({ top:0, behavior:"smooth" });
}

function openRange(key){
  const r = RANGES.find(x => x.key === key);
  if (!r) return;
  currentRangeKey = key;
  document.getElementById("rangeTitle").textContent = "Territorios " + r.label;

  const grid = document.getElementById("territoryGrid");
  let items = "";
  for (let n = r.from; n <= r.to; n++){
    items += `<div class="territory-pill" data-n="${n}" tabindex="0" role="button">${n}</div>`;
  }
  grid.innerHTML = items;
  grid.querySelectorAll(".territory-pill").forEach(p => {
    p.addEventListener("click", () => openTerritory(parseInt(p.dataset.n)));
    p.addEventListener("keydown", e => { if (e.key==="Enter"||e.key===" "){ e.preventDefault(); openTerritory(parseInt(p.dataset.n)); } });
  });

  showOnly(viewRange);
}

async function openTerritory(n){
  document.getElementById("territoryTitle").textContent = "Territorio " + n;
  showOnly(viewTerritory);
  await renderPdf(territoryPdfSrc(n), document.getElementById("territoryCanvas"), document.getElementById("territoryHint"), 3);
  resetZoom(territoryZoom);
}

async function openGeneral(){
  showOnly(viewGeneral);
  await renderPdf(GENERAL_PDF_SRC, document.getElementById("generalCanvas"), document.getElementById("generalHint"), 1.6);
  resetZoom(generalZoom);
}

document.getElementById("openGeneral").addEventListener("click", openGeneral);
document.getElementById("openGeneral").addEventListener("keydown", e => { if (e.key==="Enter"||e.key===" "){ e.preventDefault(); openGeneral(); } });

document.getElementById("backFromRange").addEventListener("click", () => showOnly("home"));
document.getElementById("backFromTerritory").addEventListener("click", () => openRange(currentRangeKey || RANGES[0].key));
document.getElementById("backFromGeneral").addEventListener("click", () => showOnly("home"));

/* =========================================================================
   VISOR CON ZOOM / PAN (reutilizable)
   ========================================================================= */
function createZoomController(viewerEl, layerEl, el){
  const state = { scale:1, tx:0, ty:0, minScale:1, maxScale:5 };
  let dragging = false, lastX=0, lastY=0;
  let pinchStartDist = 0, pinchStartScale = 1;

  function apply(){
    layerEl.style.transform = `translate(${state.tx}px, ${state.ty}px) scale(${state.scale})`;
  }

  function clamp(){
    const vw = viewerEl.clientWidth, vh = viewerEl.clientHeight;
    const iw = el.width || vw, ih = el.height || vh;
    const fitScale = Math.min(vw / iw, vh / ih);
    state.minScale = fitScale;
    if (state.scale < fitScale) state.scale = fitScale;
    const scaledW = iw * state.scale, scaledH = ih * state.scale;
    const minTx = Math.min(0, vw - scaledW), maxTx = 0;
    const minTy = Math.min(0, vh - scaledH), maxTy = 0;
    state.tx = Math.max(minTx, Math.min(maxTx, state.tx));
    state.ty = Math.max(minTy, Math.min(maxTy, state.ty));
  }

  function reset(){
    const vw = viewerEl.clientWidth, vh = viewerEl.clientHeight;
    const iw = el.width || vw, ih = el.height || vh;
    const fitScale = Math.min(vw / iw, vh / ih) || 1;
    state.scale = fitScale;
    state.tx = (vw - iw * fitScale) / 2;
    state.ty = 0;
    clamp();
    apply();
  }

  function zoomAt(clientX, clientY, factor){
    const rect = viewerEl.getBoundingClientRect();
    const px = clientX - rect.left, py = clientY - rect.top;
    const imgX = (px - state.tx) / state.scale;
    const imgY = (py - state.ty) / state.scale;
    state.scale = Math.max(state.minScale, Math.min(state.maxScale, state.scale * factor));
    state.tx = px - imgX * state.scale;
    state.ty = py - imgY * state.scale;
    clamp();
    apply();
  }

  function zoomToPoint(clientX, clientY, targetScale){
    const rect = viewerEl.getBoundingClientRect();
    const px = clientX - rect.left, py = clientY - rect.top;
    const imgX = (px - state.tx) / state.scale;
    const imgY = (py - state.ty) / state.scale;
    state.scale = Math.max(state.minScale, Math.min(state.maxScale, targetScale));
    state.tx = px - imgX * state.scale;
    state.ty = py - imgY * state.scale;
    clamp();
    apply();
  }

  viewerEl.addEventListener("wheel", e => {
    e.preventDefault();
    const factor = e.deltaY < 0 ? 1.15 : 0.87;
    zoomAt(e.clientX, e.clientY, factor);
  }, { passive:false });

  viewerEl.addEventListener("mousedown", e => {
    dragging = true; lastX = e.clientX; lastY = e.clientY;
    viewerEl.classList.add("dragging");
  });
  window.addEventListener("mousemove", e => {
    if (!dragging) return;
    state.tx += e.clientX - lastX;
    state.ty += e.clientY - lastY;
    lastX = e.clientX; lastY = e.clientY;
    clamp(); apply();
  });
  window.addEventListener("mouseup", () => { dragging=false; viewerEl.classList.remove("dragging"); });

  viewerEl.addEventListener("dblclick", () => reset());

  viewerEl.addEventListener("touchstart", e => {
    if (e.touches.length === 1){
      dragging = true; lastX = e.touches[0].clientX; lastY = e.touches[0].clientY;
    } else if (e.touches.length === 2){
      dragging = false;
      pinchStartDist = touchDist(e.touches);
      pinchStartScale = state.scale;
    }
  }, { passive:true });

  viewerEl.addEventListener("touchmove", e => {
    if (e.touches.length === 1 && dragging){
      const dx = e.touches[0].clientX - lastX, dy = e.touches[0].clientY - lastY;
      state.tx += dx; state.ty += dy;
      lastX = e.touches[0].clientX; lastY = e.touches[0].clientY;
      clamp(); apply();
    } else if (e.touches.length === 2){
      const dist = touchDist(e.touches);
      const factor = dist / (pinchStartDist || dist);
      const midX = (e.touches[0].clientX + e.touches[1].clientX) / 2;
      const midY = (e.touches[0].clientY + e.touches[1].clientY) / 2;
      zoomToPoint(midX, midY, pinchStartScale * factor);
    }
    e.preventDefault();
  }, { passive:false });

  viewerEl.addEventListener("touchend", e => {
    if (e.touches.length === 0) dragging = false;
  });

  function touchDist(touches){
    const dx = touches[0].clientX - touches[1].clientX;
    const dy = touches[0].clientY - touches[1].clientY;
    return Math.sqrt(dx*dx + dy*dy);
  }

  window.addEventListener("resize", () => { clamp(); apply(); });

  return { reset, state };
}

const territoryZoom = createZoomController(
  document.getElementById("territoryViewer"),
  document.getElementById("territoryZoomLayer"),
  document.getElementById("territoryCanvas")
);
const generalZoom = createZoomController(
  document.getElementById("generalViewer"),
  document.getElementById("generalZoomLayer"),
  document.getElementById("generalCanvas")
);

function resetZoom(controller){
  requestAnimationFrame(() => controller.reset());
}

/* =========================================================================
   PANTALLA COMPLETA
   ========================================================================= */
function setupFullscreen(viewerEl, btnEl, zoomController){
  const expandIcon = `<path d="M9 4H5a1 1 0 00-1 1v4M15 4h4a1 1 0 011 1v4M9 20H5a1 1 0 01-1-1v-4M15 20h4a1 1 0 001-1v-4"/>`;
  const collapseIcon = `<path d="M4 9V5a1 1 0 011-1h4M20 9V5a1 1 0 00-1-1h-4M4 15v4a1 1 0 001 1h4M20 15v4a1 1 0 01-1 1h-4"/>`;

  btnEl.addEventListener("click", () => {
    if (!document.fullscreenElement && !document.webkitFullscreenElement){
      (viewerEl.requestFullscreen || viewerEl.webkitRequestFullscreen)?.call(viewerEl);
    } else {
      (document.exitFullscreen || document.webkitExitFullscreen)?.call(document);
    }
  });

  function onFullscreenChange(){
    const isFs = document.fullscreenElement === viewerEl || document.webkitFullscreenElement === viewerEl;
    btnEl.innerHTML = `<svg viewBox="0 0 24 24">${isFs ? collapseIcon : expandIcon}</svg>`;
    btnEl.title = isFs ? "Salir de pantalla completa" : "Pantalla completa";
    // el tamaño del visor cambia al entrar/salir: recalcular el encuadre
    requestAnimationFrame(() => zoomController.reset());
  }
  document.addEventListener("fullscreenchange", onFullscreenChange);
  document.addEventListener("webkitfullscreenchange", onFullscreenChange);
}

setupFullscreen(
  document.getElementById("territoryViewer"),
  document.getElementById("territoryFullscreenBtn"),
  territoryZoom
);
setupFullscreen(
  document.getElementById("generalViewer"),
  document.getElementById("generalFullscreenBtn"),
  generalZoom
);

/* =========================================================================
   RENDERIZADO DE PDF — dibuja el PDF directamente en el canvas, en alta
   resolución (nítido incluso haciendo zoom), sin pasar por una imagen
   comprimida. Usa la librería pdf.js.
   ========================================================================= */
async function renderPdf(url, canvas, hintEl, scale){
  try{
    hintEl.textContent = "Cargando mapa…";
    const pdf = await pdfjsLib.getDocument(url).promise;
    const page = await pdf.getPage(1);
    const viewport = page.getViewport({ scale });
    canvas.width = viewport.width;
    canvas.height = viewport.height;
    const ctx = canvas.getContext("2d");
    await page.render({ canvasContext: ctx, viewport }).promise;
    hintEl.textContent = "Arrastra para mover · rueda o pellizca para acercar";
  } catch (err){
    console.error("No se pudo cargar el PDF:", url, err);
    hintEl.textContent = `No se encontró el mapa en: ${url} — revisa que el archivo esté subido con ese nombre exacto.`;
  }
}
</script>
